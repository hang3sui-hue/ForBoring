<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>光速摩托 · ForBoring</title>
<link rel="stylesheet" href="../common.css?v=1794620000">
<style>
  .stage{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 12px;text-align:center}
  .eyebrow{font-size:12px;color:var(--muted);letter-spacing:1px}.status{line-height:1.6;min-height:26px;margin:8px 0 14px}
  .seats{display:flex;gap:10px;margin:12px 0}.seat{flex:1;min-width:0;padding:10px 8px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-size:13px;text-align:center;overflow-wrap:anywhere}.seat.active{background:var(--accent-soft);border-color:var(--accent)}.seat b{display:block;font-size:18px;margin-top:2px}
  .reacts button{font-size:20px;padding:6px 1px}
  .count{font-size:30px;font-weight:900;color:var(--accent);min-height:38px}
  canvas{width:100%;max-width:380px;aspect-ratio:1;display:block;margin:0 auto;border-radius:12px;background:#1d1a24;touch-action:none}
  .pads{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,50px);gap:6px;justify-content:center}
  .pad button{font-size:20px;padding:0;touch-action:manipulation}.pad.p0 button{background:#fbe3e7}.pad.p1 button{background:#dce9f6}
  .pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .dn{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad.flip{transform:rotate(180deg)}
  .pass canvas{max-width:300px}

</style>
</head>
<body>
<div class="wrap">
  <section id="lobby"><a class="back" href="../">‹ 返回主页</a><h1>光速摩托</h1><p class="sub">两辆摩托边跑边在身后留下光墙，<br>谁先撞上墙或光墙谁就输，先拿 3 分的赢 🏍️</p>
    <div class="card"><label for="code">房间号（字母或数字）</label><div class="row"><input id="code" maxlength="12" placeholder="比如 love520" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="rand" class="ghost" aria-label="随机房间号">🎲</button></div><button id="join" class="primary block">进入房间</button><div class="divider">或者</div><button id="local" class="ghost block" style="margin-top:6px">先和电脑玩</button><button id="pass" class="ghost block">同一台手机轮流玩</button></div>
    <p class="hint">摩托不会停，只能转弯，不能直接掉头。<br>想办法把对方逼进死角。</p>
  </section>
  <section id="game" class="hidden"><div class="topbar"><div id="roomtag" class="roomtag"></div><div class="row" style="gap:6px"><button id="copy" class="ghost small">复制邀请</button><button id="leave" class="ghost small">离开</button></div></div>
    <div class="seats"><div id="seat0" class="seat"></div><div id="seat1" class="seat"></div></div>
    <div class="stage"><div id="round" class="eyebrow"></div><div id="status" class="status" role="status" aria-live="polite"></div><div id="count" class="count"></div><canvas id="cv" width="384" height="384"></canvas><div id="pads" class="pads"></div><div id="board"></div></div>
    <p class="hint" id="caption">联机时由先进房间的一方计算比赛，网络慢时可能会有一点延迟。</p><button id="again" class="ghost block">重开一局</button><div id="reacts" class="reacts"></div>
  </section>
</div>
<div id="modal" class="modal hidden"><div class="card"><h3 id="mT"></h3><p id="mP"></p><div class="row" id="mBtns"></div></div></div><div id="toast" class="toast"></div>
<script src="../common.js?v=1794620000"></script>
<script src="../mqtt.min.js"></script>
<script src="../rt.js?v=1794620000"></script>
<script>
(() => {
'use strict';

const $=id=>document.getElementById(id),ui=FB.ui,N=32,TICK=110,WIN=3,DX=[0,1,0,-1],DY=[-1,0,1,0],COL=['#ff6b81','#4da3ff'],TRAIL=['#b8445a','#2f6fb3'];
let L=null,k=-1,score=[0,0],phase='idle',occ=new Uint8Array(N*N),bikes=[],want=[null,null],tick=0,loop=null,cdT=[],nextT=null;
const pair=()=>L.pair(),mi=()=>pair().indexOf(L.me());
const cv=$('cv'),ctx=cv.getContext('2d');
function reset(){occ=new Uint8Array(N*N);bikes=[{x:6,y:N/2,d:1,alive:true},{x:N-7,y:N/2,d:3,alive:true}];want=[null,null];tick=0;bikes.forEach((b,i)=>occ[b.y*N+b.x]=i+1);}
function seats(){for(let p=0;p<2;p++){const id=pair()[p],e=$('seat'+p),b=document.createElement('b');b.textContent=score[p]+' 分';e.replaceChildren(document.createTextNode((p?'🔵 ':'🔴 ')+(id?L.nameOf(id):'等 TA 来')),b);}}
function draw(){
  const s=cv.width/N;ctx.fillStyle='#1d1a24';ctx.fillRect(0,0,cv.width,cv.height);ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;
  for(let i=0;i<=N;i+=4){ctx.beginPath();ctx.moveTo(i*s,0);ctx.lineTo(i*s,cv.height);ctx.moveTo(0,i*s);ctx.lineTo(cv.width,i*s);ctx.stroke();}
  for(let i=0;i<N*N;i++)if(occ[i]){ctx.fillStyle=TRAIL[occ[i]-1];ctx.fillRect((i%N)*s+1,Math.floor(i/N)*s+1,s-2,s-2);}
  bikes.forEach((b,i)=>{ctx.fillStyle=b.alive?COL[i]:'#777';ctx.shadowColor=COL[i];ctx.shadowBlur=b.alive?10:0;ctx.fillRect(b.x*s,b.y*s,s,s);ctx.shadowBlur=0;});
}
// The host (or the only phone, offline) runs the race; the other phone just draws what it receives.
function step(){
  [0,1].forEach(i=>{const w=want[i];if(w!==null&&(w+2)%4!==bikes[i].d)bikes[i].d=w;want[i]=null;});
  if(L.mode==='bot')want[1]=botDir();
  [0,1].forEach(i=>{if(L.mode==='bot'&&i===1){const w=want[1];if(w!==null&&(w+2)%4!==bikes[1].d)bikes[1].d=w;want[1]=null;}});
  const nx=bikes.map(b=>({x:b.x+DX[b.d],y:b.y+DY[b.d]}));
  const dead=nx.map(p=>p.x<0||p.y<0||p.x>=N||p.y>=N||occ[p.y*N+p.x]);
  if(nx[0].x===nx[1].x&&nx[0].y===nx[1].y)dead[0]=dead[1]=true;
  bikes.forEach((b,i)=>{if(!dead[i]){b.x=nx[i].x;b.y=nx[i].y;occ[b.y*N+b.x]=i+1;}else b.alive=false;});tick++;
  if(L.mode==='online')L.emit('f',{k,n:tick,h:bikes.map(b=>[b.x,b.y,b.d,b.alive?1:0]),g:tick%15===0?snap():undefined});
  draw();if(dead[0]||dead[1])roundEnd(dead[0]&&dead[1]?-1:dead[0]?1:0,true);
}
const snap=()=>Array.from(occ).join('');
function free(x,y){return x>=0&&y>=0&&x<N&&y<N&&!occ[y*N+x];}
function area(x,y,lim){const seen=new Set([y*N+x]),q=[[x,y]];while(q.length&&seen.size<lim){const [a,b]=q.pop();for(let d=0;d<4;d++){const u=a+DX[d],v=b+DY[d];if(free(u,v)&&!seen.has(v*N+u)){seen.add(v*N+u);q.push([u,v]);}}}return seen.size;}
function botDir(){const b=bikes[1],o=bikes[0];let best=-1,pick=b.d;for(const d of [b.d,(b.d+1)%4,(b.d+3)%4]){const x=b.x+DX[d],y=b.y+DY[d];if(!free(x,y))continue;
  let sc=area(x,y,260)+(d===b.d?3:0)+Math.random()*4;if(Math.abs(x-(o.x+DX[o.d]))+Math.abs(y-(o.y+DY[o.d]))===0)sc-=200;if(sc>best){best=sc;pick=d;}}return pick;}
function apply(f){ // guest: copy the host's frame, filling the trail between missed frames
  if(f.n<=tick)return;f.h.forEach((h,i)=>{const b=bikes[i];let x=b.x,y=b.y;while(x!==h[0]||y!==h[1]){if(x!==h[0])x+=Math.sign(h[0]-x);else y+=Math.sign(h[1]-y);if(x>=0&&y>=0&&x<N&&y<N)occ[y*N+x]=i+1;}b.x=h[0];b.y=h[1];b.d=h[2];b.alive=!!h[3];});
  if(typeof f.g==='string'&&f.g.length===N*N)for(let i=0;i<N*N;i++)occ[i]=+f.g[i]||0;tick=f.n;draw();
}
function status(t){$('status').textContent=t;}
function start(kk){
  clearInterval(loop);cdT.forEach(clearTimeout);cdT=[];k=kk;reset();phase='count';draw();status('');let n=3;$('count').textContent=n;
  for(let i=1;i<=3;i++)cdT.push(setTimeout(()=>{n--;$('count').textContent=n||'GO！';if(!n){phase='go';status(L.mode==='pass'?'红方用 WASD 或下面的按键，蓝方用方向键或上面的按键':'用方向键、滑动或按键转弯，别撞墙');if(L.isHost())loop=setInterval(step,TICK);}},i*800));
}
function roundEnd(w,send){
  if(phase!=='go'&&phase!=='count')return;clearInterval(loop);phase='done';if(send&&L.mode==='online')L.emit('end',{k,w});
  if(w>=0)score[w]++;seats();const over=score[0]>=WIN||score[1]>=WIN;$('count').textContent='';
  status(over?L.nameOf(pair()[score[0]>=WIN?0:1])+'先拿到 '+WIN+' 分，赢啦！🎉':(w<0?'同时撞上了，这局平手':L.nameOf(pair()[w])+'活到了最后')+' · '+score[0]+' : '+score[1]);
  if(over){phase='over';ui.burst('🏆');}else if(L.isHost())nextT=setTimeout(newRound,2200);
}
function newRound(){if(!L.both()){status('等 TA 进入同一个房间…');return;}const kk=k+1;if(L.mode==='online')L.emit('go',{k:kk});start(kk);}
function turn(p,d){if(phase!=='go'&&phase!=='count')return;if(L.mode==='online'){if(p!==mi())return;if(L.isHost())want[p]=d;else L.emit('d',{k,d});}else want[p]=d;}
function pads(){
  const box=$('pads');box.replaceChildren();const who=L.mode==='pass'?[1,0]:[mi()];$('board').classList.toggle('pass',L.mode==='pass');
  who.forEach(p=>{if(p<0)return;const pd=document.createElement('div');pd.className='pad p'+p+(L.mode==='pass'&&p===1?' flip':'');
    [['u',0,'↑'],['l',3,'←'],['dn',2,'↓'],['r',1,'→']].forEach(([c,d,t])=>{const b=document.createElement('button');b.className='ghost '+c;b.textContent=t;b.addEventListener('pointerdown',e=>{e.preventDefault();turn(p,d);});pd.appendChild(b);});box.appendChild(pd);});
}
document.addEventListener('keydown',e=>{const a={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3}[e.key],w={w:0,d:1,s:2,a:3,W:0,D:1,S:2,A:3}[e.key];
  if(a===undefined&&w===undefined)return;e.preventDefault();if(L.mode==='pass'){if(w!==undefined)turn(0,w);if(a!==undefined)turn(1,a);}else turn(mi(),a!==undefined?a:w);});
let sx=0,sy=0;cv.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;});
cv.addEventListener('pointerup',e=>{if(L.mode==='pass')return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;turn(mi(),Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));});
$('again').textContent='重新开始';
$('again').onclick=()=>{if(phase==='go'||phase==='count')return;if(L.mode==='online'&&!L.isHost()){L.emit('ask',{});ui.toast('已经喊 TA 开始了');return;}score=[0,0];seats();if(L.mode==='online')L.emit('reset',{});newRound();};
reset();draw();
L=FBLive({key:'tron',name:'光速摩托',
  start(l){pads();seats();if(l.mode!=='online')setTimeout(newRound,600);else status('等 TA 进入同一个房间…');},
  peers(l){pads();seats();if(l.both()&&phase==='idle'&&l.isHost())setTimeout(()=>{if(phase==='idle')newRound();},1200);if(!l.both()&&(phase==='go'||phase==='count')){clearInterval(loop);cdT.forEach(clearTimeout);phase='idle';status('TA 离开了');}},
  event(d,l){
    if(!pair().includes(d.from))return;const host=pair()[0],p=pair().indexOf(d.from);
    if(d.from===host&&!l.isHost()){
      if(d.t==='go'&&Number.isInteger(d.k))start(d.k);
      else if(d.t==='f'&&d.k===k&&Array.isArray(d.h)&&d.h.length===2){if(phase==='count'){phase='go';$('count').textContent='';}apply(d);}
      else if(d.t==='end'&&d.k===k)roundEnd(d.w===0||d.w===1?d.w:-1,false);
      else if(d.t==='reset'){score=[0,0];seats();}
    } else if(l.isHost()){
      if(d.t==='d'&&d.k===k&&[0,1,2,3].includes(d.d))want[p]=d.d;
      else if(d.t==='ask'&&phase!=='go'&&phase!=='count'){if(phase==='over'){score=[0,0];seats();L.emit('reset',{});}newRound();}
    }
  }});

})();
</script>
</body>
</html>
