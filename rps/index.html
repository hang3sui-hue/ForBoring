<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>石头剪刀布 · ForBoring</title>
<style>
  :root{ --bg:#f6efe6; --ink:#2b2420; --muted:#8a7b6f; --card:#fffaf4; --accent:#d9586b; --accent-soft:#f6dde1; --line:#e7dccf; --win:#3f9d6b; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
  body{min-height:100vh;display:flex;justify-content:center}
  .wrap{width:100%;max-width:560px;padding:20px 16px 40px}
  h1{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-weight:700;font-size:30px;margin:8px 0 4px;letter-spacing:2px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 22px}
  .back{display:inline-block;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 24px rgba(80,50,30,.06)}
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:8px}
  .row{display:flex;gap:10px}
  input{flex:1;min-width:0;font:inherit;font-size:20px;letter-spacing:3px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);outline:none;text-transform:lowercase}
  input:focus{border-color:var(--accent)}
  button{font:inherit;font-weight:500;border:none;border-radius:12px;padding:12px 16px;cursor:pointer;background:#efe5d8;color:var(--ink);transition:transform .08s,opacity .2s}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.4;cursor:default}
  .primary{background:var(--accent);color:#fff}
  .ghost{background:transparent;border:1.5px solid var(--line)}
  .block{width:100%;margin-top:12px;padding:14px}
  .hint{font-size:13px;color:var(--muted);line-height:1.6;margin-top:14px}
  .divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:18px 0 6px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .hidden{display:none!important}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .roomtag{font-size:13px;color:var(--muted)}
  .roomtag b{color:var(--ink);letter-spacing:2px;font-size:16px}
  .small{padding:7px 12px;font-size:13px;border-radius:10px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-right:6px;vertical-align:middle}
  .dot.on{background:#4caf7a}

  .score{display:flex;align-items:center;justify-content:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
  .score .side{text-align:center;min-width:70px}
  .score .who{font-size:13px;color:var(--muted)}
  .score .n{font-family:"Songti SC","STSong",serif;font-size:40px;font-weight:700;line-height:1.1}
  .score .mid{font-size:12px;color:var(--muted);text-align:center}
  .score .mid b{display:block;font-size:20px;color:var(--ink);font-weight:500}

  .arena{position:relative;display:flex;justify-content:space-around;align-items:center;margin:18px 0 6px;height:170px;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
  .hand{text-align:center;width:42%}
  .hand .em{font-size:76px;line-height:1;height:90px;display:flex;align-items:center;justify-content:center;transition:transform .2s}
  .hand .lb{font-size:13px;color:var(--muted);margin-top:8px}
  .hand.lose .em{opacity:.35;transform:scale(.85)}
  .hand.win .em{transform:scale(1.12)}
  .vs{font-family:"Songti SC","STSong",serif;color:var(--muted);font-size:18px}
  .shake .em{animation:shake .32s ease-in-out 3}
  .hand.opp.shake .em{animation-name:shakeR}
  @keyframes shake{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(-12deg)}}
  @keyframes shakeR{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(12deg)}}
  .flip{display:inline-block;transform:scaleX(-1)}
  .waiting{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}

  .status{text-align:center;font-size:16px;margin:12px 0 14px;min-height:24px}
  .status.go{color:var(--accent);font-weight:700}
  .status.win{color:var(--win);font-weight:700;font-size:20px}
  .status.lose{color:var(--accent);font-weight:700;font-size:20px}

  .picks{display:flex;gap:10px}
  .pick{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 6px;background:var(--card);border:2px solid var(--line);border-radius:18px;font-size:13px;color:var(--muted)}
  .pick span{font-size:40px;line-height:1.1}
  .pick.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);color:var(--ink)}
  .actions{display:flex;gap:8px;margin-top:12px}
  .actions button{flex:1}
  .reacts{display:flex;justify-content:space-between;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px}
  .reacts button{background:transparent;font-size:20px;padding:6px 1px;flex:1;min-width:0}
  .hist{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px;min-height:20px}
  .hist i{font-style:normal;font-size:12px;padding:3px 8px;border-radius:10px;background:#efe5d8;color:var(--muted)}
  .hist i.w{background:#dcefe3;color:var(--win)} .hist i.l{background:var(--accent-soft);color:var(--accent)}
  .float{position:fixed;bottom:80px;font-size:34px;pointer-events:none;animation:up 2.2s ease-out forwards;z-index:50}
  @keyframes up{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-30px) scale(1.15)}100%{transform:translateY(-55vh) scale(1);opacity:0}}
  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:120;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.on{opacity:.92}
  .modal{position:fixed;inset:0;background:rgba(40,25,15,.35);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
  .modal .card{max-width:340px;width:100%;text-align:center}
  .modal h3{font-family:"Songti SC","STSong",serif;margin:4px 0 8px;font-size:22px}
  .modal p{color:var(--muted);margin:0 0 16px;font-size:14px}
  .modal .row button{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <section id="lobby">
    <a class="back" href="../">‹ 返回主页</a>
    <h1>石头剪刀布</h1>
    <p class="sub">谁输谁洗碗 ✊✌️✋</p>
    <div class="card">
      <label for="code">房间号（字母或数字）</label>
      <div class="row">
        <input id="code" maxlength="12" placeholder="比如 love520" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="rand" class="ghost" title="随机生成">🎲</button>
      </div>
      <button id="join" class="primary block">进入房间</button>
      <div class="hint">两个人输入同一个房间号就会配对。双方都出完才会同时亮手，谁也偷看不了。</div>
      <div class="divider">或者</div>
      <button id="bot" class="ghost block" style="margin-top:6px">先和电脑练练手</button>
    </div>
  </section>

  <section id="game" class="hidden">
    <div class="topbar">
      <div class="roomtag" id="roomtag"></div>
      <div class="row" style="gap:6px">
        <button id="copy" class="ghost small">复制邀请</button>
        <button id="leave" class="ghost small">离开</button>
      </div>
    </div>

    <div class="score">
      <div class="side"><div class="who">你</div><div class="n" id="sMe">0</div></div>
      <div class="mid">平局<b id="sTie">0</b></div>
      <div class="side"><div class="who" id="oppName">TA</div><div class="n" id="sOpp">0</div></div>
    </div>

    <div class="arena">
      <div class="hand me" id="hMe"><div class="em" id="eMe">❔</div><div class="lb">你</div></div>
      <div class="vs">VS</div>
      <div class="hand opp" id="hOpp"><div class="em" id="eOpp">❔</div><div class="lb" id="lOpp">TA</div></div>
    </div>

    <div class="status" id="status"></div>

    <div class="picks" id="picks">
      <button class="pick" data-c="r"><span>✊</span>石头</button>
      <button class="pick" data-c="s"><span>✌️</span>剪刀</button>
      <button class="pick" data-c="p"><span>✋</span>布</button>
    </div>
    <div class="actions">
      <button id="next" class="primary hidden">下一局</button>
      <button id="reset" class="ghost">比分清零</button>
    </div>
    <div class="hist" id="hist"></div>

    <div class="reacts" id="reacts">
      <button>❤️</button><button>😘</button><button>😂</button><button>😤</button><button>👍</button><button>🥺</button><button>🎉</button><button>🥲</button><button>🙈</button>
    </div>
  </section>
</div>

<div id="modal" class="modal hidden"><div class="card"><h3 id="mT"></h3><p id="mP"></p><div class="row" id="mBtns"></div></div></div>
<div id="toast" class="toast"></div>

<script src="../common.js?v=1794503478"></script>
<script src="../mqtt.min.js"></script>
<script>
(() => {
  const BROKER='wss://broker-cn.emqx.io:8084/mqtt', NS='rps-duo-v1', ALIVE_MS=45000;
  const EM={r:'✊',s:'✌️',p:'✋'}, NAME={r:'石头',s:'剪刀',p:'布'}, BEATS={r:'s',s:'p',p:'r'};
  const EMO=['❤️','😘','😂','😤','👍','🥺','🎉','🥲','🙈'];
  let xray=false, seq=[];
  const cheatTap=b=>{ seq.push([...$('reacts').children].indexOf(b)); if(seq.length>7) seq.shift(); if(seq.join('')==='0014785'){ seq=[]; xray=!xray; render(); } };
  const $=id=>document.getElementById(id);

  let myId; try{ myId=localStorage.getItem('wzq-id'); }catch(_){}
  if(!myId){ myId=Math.random().toString(36).slice(2,12); try{ localStorage.setItem('wzq-id',myId); }catch(_){} }

  let mode=null, code='', client=null, base='', conn=false, hb=null, tick=null;
  let others=new Map();     // id -> {t, r, locked, c, sr}
  let me={ r:0, locked:false, c:null, revealed:false, sr:0 };   // sr = score-reset epoch
  let score={ me:0, opp:0, tie:0, hist:[] , counted:{} };
  let shownRound=-1, wasPresent=new Set(), animating=false;

  // ---------- ui helpers ----------
  function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }
  function modal(title,text,btns){ $('mT').textContent=title; $('mP').textContent=text; const b=$('mBtns'); b.innerHTML=''; btns.forEach(x=>{ const e=document.createElement('button'); e.textContent=x.label; if(x.primary) e.className='primary'; e.onclick=()=>{ $('modal').classList.add('hidden'); x.fn&&x.fn(); }; b.appendChild(e); }); $('modal').classList.remove('hidden'); }
  function floatEmoji(e){ const el=document.createElement('div'); el.className='float'; el.textContent=e; el.style.left=(10+Math.random()*75)+'vw'; document.body.appendChild(el); setTimeout(()=>el.remove(),2300); }
  function burst(e){ for(let i=0;i<7;i++) setTimeout(()=>floatEmoji(e),i*120); }
  const outcome=(a,b)=> a===b?0 : (BEATS[a]===b?1:-1);

  // ---------- persistence (per room) ----------
  const key=()=> 'rps-'+(mode==='bot'?'bot':code);
  function save(){ try{ localStorage.setItem(key(), JSON.stringify({me,score})); }catch(_){} }
  function load(){
    try{ const d=JSON.parse(localStorage.getItem(key())||'null'); if(d&&d.me&&d.score){ me=d.me; score=d.score; if(!score.counted) score.counted={}; } }catch(_){}
  }

  // ---------- opponent ----------
  function presentIds(){ const now=Date.now(), ids=[]; others.forEach((o,id)=>{ if(now-o.t<ALIVE_MS) ids.push(id); }); return ids.sort(); }
  function opp(){
    if (mode==='bot') return botState;
    const ids=presentIds(); if(!ids.length) return null;
    const all=ids.concat(conn?[myId]:[]).sort().slice(0,2);
    if (!all.includes(myId)) return null;
    const oid=all.find(i=>i!==myId); return oid? Object.assign({id:oid}, others.get(oid)) : null;
  }

  // ---------- bot ----------
  let botState=null;
  function botPlay(){
    const r=me.r; botState={ id:'bot', r, locked:false, c:null, sr:me.sr };
    setTimeout(()=>{ if(mode!=='bot'||me.r!==r) return; botState={ id:'bot', r, locked:true, c:null, sr:me.sr }; step(); }, 500+Math.random()*900);
  }

  // ---------- network ----------
  function pub(sub,obj,retain){ if(client&&conn) client.publish(base+'/'+sub, obj===null?'':JSON.stringify(obj), {qos:1, retain:!!retain}); }
  function publishMe(){
    if (mode!=='online') return;
    pub('p/'+myId, { t:Date.now(), n:FB.name(), r:me.r, locked:me.locked, c: me.revealed?me.c:null, sr:me.sr, x: me.locked&&me.c ? (('rsp'.indexOf(me.c)+3)*7+me.r%5).toString(36) : '' }, true);
    if(client&&conn) FB.hubBeat(client, code, myId, 'rps');
  }
  const names=new Map(); const nameOf=id=>names.get(id)||'TA';
  const T=()=>{ const o=opp(); return (o&&o.id&&names.get(o.id))||'TA'; };
  function onMessage(topic,payload){
    const sub=topic.slice(base.length+1), txt=payload.toString();
    let d=null; if(txt){ try{ d=JSON.parse(txt); }catch(_){ return; } }
    if (sub.startsWith('p/')){
      const id=sub.slice(2); if(!/^[a-z0-9]{1,16}$/.test(id)||id===myId) return;
      if(!d){ others.delete(id); }
      else if (typeof d.t==='number' && Number.isInteger(d.r) && d.r>=0){
        if(FB.cleanName(d.n)) names.set(id, FB.cleanName(d.n));
        const xi = typeof d.x==='string' && d.x ? (parseInt(d.x,36)-d.r%5)/7-3 : -1;
        others.set(id,{ t:d.t, r:d.r, locked:!!d.locked, c:(d.c in EM)?d.c:null, sr:Number.isInteger(d.sr)?d.sr:0, x: xi>=0&&xi<3&&Number.isInteger(xi) ? 'rsp'[xi] : null });
      }
      checkPeers(); step();
    } else if (sub==='e' && d && d.from!==myId){
      if (d.t==='react' && EMO.includes(d.e)) floatEmoji(d.e);
    }
  }
  function checkPeers(){
    const cur=new Set(presentIds());
    cur.forEach(id=>{ if(!wasPresent.has(id)) toast(nameOf(id)+' 来了 💕'); });
    wasPresent.forEach(id=>{ if(!cur.has(id)) toast(nameOf(id)+' 离开了房间'); });
    wasPresent=cur; render();
  }
  function connect(c){
    code=c; base=NS+'/'+c; others=new Map(); wasPresent=new Set(); conn=false;
    client=mqtt.connect(BROKER,{ clientId:'rps_'+myId+'_'+Math.random().toString(36).slice(2,6), clean:true, keepalive:30, reconnectPeriod:2000, connectTimeout:10000,
      will:{ topic:base+'/p/'+myId, payload:'', qos:1, retain:true } });
    client.on('connect',()=>{ conn=true; client.subscribe(base+'/#',{qos:1}); publishMe(); render(); });
    client.on('message',onMessage);
    client.on('close',()=>{ conn=false; render(); });
    client.on('offline',()=>{ conn=false; render(); });
    client.on('error',()=>{});
    hb=setInterval(publishMe,15000); tick=setInterval(checkPeers,5000);
  }
  const hubClear=()=>{ try{ client.publish('hub-duo-v1/'+code+'/p/'+myId,'',{qos:1,retain:true}); }catch(_){} };
  function disconnect(){ clearInterval(hb); clearInterval(tick); if(client){ try{ if(conn) pub('p/'+myId,null,true); hubClear(); client.end(false); }catch(_){} } client=null; conn=false; }
  window.addEventListener('pagehide',()=>{ if(client&&conn){ try{ pub('p/'+myId,null,true); hubClear(); }catch(_){} } });

  // ---------- core round logic ----------
  function step(){
    const o=opp();
    // score reset sync: follow the higher epoch
    if (o && o.sr>me.sr){ me.sr=o.sr; score={me:0,opp:0,tie:0,hist:[],counted:{}}; toast('比分已清零'); save(); }
    // round sync: if the other side is ahead and I haven't committed, catch up
    if (o && o.r>me.r && !me.locked){ me.r=o.r; me.c=null; me.revealed=false; save(); }
    // reveal once both are locked in the same round
    if (o && me.locked && !me.revealed && o.r===me.r && (o.locked||o.c)){ me.revealed=true; save(); publishMe(); }
    if (mode==='bot' && o && me.locked && o.locked && !o.c && o.r===me.r){
      const cs=['r','s','p']; botState=Object.assign({},o,{c:cs[Math.floor(Math.random()*3)]});
    }
    // both revealed: show result
    const o2=opp();
    if (o2 && me.revealed && !me.res && o2.r===me.r && o2.c && me.c){
      me.res={mc:me.c, oc:o2.c}; save();
      if (shownRound!==me.r){ shownRound=me.r; showResult(me.c,o2.c); return; }
    }
    render();
  }
  function choose(c){
    if (me.locked) return;
    if (mode==='online' && (!conn || !opp())) { toast(opp()?'连接中…':'等 TA 进来再出吧'); return; }
    me.c=c; me.locked=true; me.revealed=false; save(); publishMe();
    if (mode==='bot' && !(botState && botState.r===me.r && botState.locked)) botPlay();
    step();
  }
  function showResult(mc, oc){
    const res=outcome(mc,oc);
    if (!score.counted[me.sr+':'+me.r]){
      score.counted[me.sr+':'+me.r]=1;
      if(res>0) score.me++; else if(res<0) score.opp++; else score.tie++;
      score.hist.push(res); if(score.hist.length>12) score.hist.shift();
      // keep counted map small
      const ks=Object.keys(score.counted); if(ks.length>60) ks.slice(0,ks.length-60).forEach(k=>delete score.counted[k]);
      save();
    }
    animating=true; render();
    $('eMe').textContent='✊'; $('eOpp').innerHTML='<span class="flip">✊</span>';
    $('hMe').className='hand me shake'; $('hOpp').className='hand opp shake';
    const st=$('status'); st.className='status';
    const words=['石头…','剪刀…','布！']; words.forEach((w,i)=>setTimeout(()=>{ st.textContent=w; }, i*320));
    setTimeout(()=>{
      animating=false;
      $('hMe').className='hand me'+(res>0?' win':res<0?' lose':'');
      $('hOpp').className='hand opp'+(res<0?' win':res>0?' lose':'');
      $('eMe').textContent=EM[mc]; $('eOpp').textContent=EM[oc];
      if (res>0){ st.textContent='你赢了！'+NAME[mc]+' 赢 '+NAME[oc]; st.className='status win'; burst('🎉'); }
      else if (res<0){ st.textContent=(mode==='bot'?'电脑':T())+'赢了… '+NAME[oc]+' 赢 '+NAME[mc]; st.className='status lose'; }
      else { st.textContent='平局，都出了'+NAME[mc]; st.className='status'; }
      render(true);
    }, 1000);
  }
  function nextRound(){
    me={ r:me.r+1, locked:false, c:null, revealed:false, res:null, sr:me.sr };
    $('hMe').className='hand me'; $('hOpp').className='hand opp';
    save(); publishMe(); step();
  }
  function resetScore(){
    me.sr++; score={me:0,opp:0,tie:0,hist:[],counted:{}}; save(); publishMe(); render(); toast('比分已清零');
  }

  // ---------- render ----------
  function render(keepResult){
    const online=mode==='online', o=opp();
    const others_n=presentIds().length;
    if (online){ $('roomtag').innerHTML='<span class="dot '+(conn&&others_n?'on':'')+'"></span>房间 <b></b>'; $('roomtag').querySelector('b').textContent=code; }
    else $('roomtag').textContent='和电脑练手';
    $('copy').classList.toggle('hidden',!online); $('reacts').classList.toggle('hidden',!online);
    const oname = mode==='bot'?'电脑':T();
    $('oppName').textContent=oname; $('lOpp').textContent=oname;
    $('sMe').textContent=score.me; $('sOpp').textContent=score.opp; $('sTie').textContent=score.tie;
    $('hist').innerHTML=score.hist.map(r=>r>0?'<i class="w">赢</i>':r<0?'<i class="l">输</i>':'<i>平</i>').join('');

    const done = me.revealed && me.res;
    document.querySelectorAll('.pick').forEach(b=>{ b.classList.toggle('sel', me.c===b.dataset.c); b.disabled = me.locked && me.c!==b.dataset.c; });
    $('next').classList.toggle('hidden', !done || animating);
    $('reset').disabled = online && !conn;
    if (animating) return;
    if (done){ if(!keepResult){ const r=outcome(me.res.mc,me.res.oc); $('eMe').textContent=EM[me.res.mc]; $('eOpp').textContent=EM[me.res.oc]; $('hMe').className='hand me'+(r>0?' win':r<0?' lose':''); $('hOpp').className='hand opp'+(r<0?' win':r>0?' lose':''); const st=$('status'); st.className='status'+(r>0?' win':r<0?' lose':''); const m=me.res.mc,q=me.res.oc; st.textContent=r>0?'你赢了！'+NAME[m]+' 赢 '+NAME[q]:r<0?oname+'赢了… '+NAME[q]+' 赢 '+NAME[m]:'平局，都出了'+NAME[m]; } return; }

    // not done: build waiting view
    $('hMe').className='hand me'; $('hOpp').className='hand opp';
    $('eMe').textContent = me.c?EM[me.c]:'❔';
    const oppLocked = o && o.r===me.r && (o.locked||o.c);
    $('eOpp').innerHTML = oppLocked ? '<span class="waiting">🤜</span>' : '<span class="waiting">🤔</span>';
    if (xray && oppLocked && o.x && mode==='online') { const t=document.createElement('span'); t.style.cssText='opacity:.3;font-size:11px;margin-left:4px'; t.textContent='·'+EM[o.x]; $('lOpp').textContent=oname; $('lOpp').appendChild(t); }
    const st=$('status'); st.className='status';
    if (online && !conn) st.textContent='连接中…';
    else if (online && !o) { st.textContent='等待 TA 输入房间号 '+code+' 进来…'; $('eOpp').textContent='💤'; }
    else if (!me.locked){ st.textContent = oppLocked ? oname+'已经出好了，该你了！' : '出拳吧'; st.className='status go'; }
    else st.textContent = oppLocked ? '马上揭晓…' : '你已出好，等'+oname+'出…';
  }

  // ---------- events ----------
  $('picks').addEventListener('click',e=>{ const b=e.target.closest('.pick'); if(b) choose(b.dataset.c); });
  $('next').onclick=nextRound;
  $('reset').onclick=()=>modal('比分清零？', mode==='online'?'你们俩的比分都会归零':'', [{label:'取消'},{label:'清零',primary:true,fn:resetScore}]);
  $('reacts').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; cheatTap(b); const n=Date.now(); if(n-(b._t||0)<400) return; b._t=n; floatEmoji(b.textContent); pub('e',{t:'react',e:b.textContent,from:myId}); });
  $('copy').onclick=()=>{ const link=location.origin+location.pathname+'#'+code; const txt='来玩石头剪刀布！打开 '+link+' ，房间号：'+code; try{ navigator.clipboard.writeText(txt).then(()=>toast('邀请已复制，发给 TA 吧'),()=>toast('房间号：'+code)); }catch(_){ toast('房间号：'+code); } };
  $('leave').onclick=()=>{ const back='../'+(mode==='online'&&code?'#'+code:''); disconnect(); mode=null; botState=null; location.href=back; };

  const clean=v=>(v||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12);
  $('code').addEventListener('input',e=>{ const c=clean(e.target.value); if(c!==e.target.value) e.target.value=c; });
  $('code').addEventListener('keydown',e=>{ if(e.key==='Enter') $('join').click(); });
  $('rand').onclick=()=>{ const a='abcdefghjkmnpqrstuvwxyz23456789'; let s=''; for(let i=0;i<6;i++) s+=a[Math.floor(Math.random()*a.length)]; $('code').value=s; };
  function start(){ me={r:0,locked:false,c:null,revealed:false,sr:0}; score={me:0,opp:0,tie:0,hist:[],counted:{}}; shownRound=-1; load(); if(me.res) shownRound=me.r; $('lobby').classList.add('hidden'); $('game').classList.remove('hidden'); }
  $('bot').onclick=()=>{ mode='bot'; code=''; start(); if(me.locked && !me.revealed){ me.locked=false; me.c=null; } botState={id:'bot',r:me.r,locked:false,c:null,sr:me.sr}; step(); };
  $('join').onclick=()=>{
    const c=clean($('code').value); if(!c){ toast('先输入一个房间号'); $('code').focus(); return; }
    if(!window.mqtt){ toast('联机组件没加载出来，刷新试试'); return; }
    FB.setRoom(c); mode='online'; code=c; start(); connect(c); step();
    try{ history.replaceState(null,'','#'+c); }catch(_){}
  };
  const h=clean(location.hash.slice(1)); $('code').value = h || FB.room(); if(h) $('join').click();
})();
</script>
</body>
</html>
