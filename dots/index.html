<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>点格棋 · ForBoring</title>
<link rel="stylesheet" href="../common.css?v=1794600000">
<style>
  .stage{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 12px;text-align:center}
  .eyebrow{font-size:12px;color:var(--muted);letter-spacing:1px}.status{line-height:1.6;min-height:26px;margin:8px 0 12px}
  .seats{display:flex;gap:10px;margin:12px 0}.seat{flex:1;min-width:0;padding:10px 8px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-size:13px;text-align:center;overflow-wrap:anywhere}.seat.active{background:var(--accent-soft);border-color:var(--accent)}
  .seat .sw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:6px}.seat b{display:block;font-size:20px;margin-top:2px}
  svg{width:100%;max-width:380px;display:block;margin:0 auto;touch-action:manipulation}
  .ln{stroke:#e6dccf;stroke-width:7;stroke-linecap:round}.ln.p0{stroke:#d9586b}.ln.p1{stroke:#3f86c9}.ln.last{stroke-width:9}
  .hit{stroke:transparent;stroke-width:30;cursor:pointer}.hit:hover+.ln.free{stroke:#c9b8a6}
  .dot{fill:#5b4e44}.box{transition:fill .25s}.box.p0{fill:#f6dde1}.box.p1{fill:#dce9f6}
  .bx{font-size:20px;dominant-baseline:central;text-anchor:middle;pointer-events:none}
  .reacts button{font-size:20px;padding:6px 1px}
</style>
</head>
<body>
<div class="wrap">
  <section id="lobby"><a class="back" href="../">‹ 返回主页</a><h1>点格棋</h1><p class="sub">轮流在两个点之间连一条线。<br>谁画下格子的第四条边，这个格子就归谁，还能再画一次 ✏️</p>
    <div class="card"><label for="code">房间号（字母或数字）</label><div class="row"><input id="code" maxlength="12" placeholder="比如 love520" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="rand" class="ghost" aria-label="随机房间号">🎲</button></div><button id="join" class="primary block">进入房间</button><div class="divider">或者</div><button id="local" class="ghost block" style="margin-top:6px">先和电脑玩</button><button id="pass" class="ghost block">同一台手机轮流玩</button></div>
    <p class="hint">4×4 一共 16 个格子，占得多的人赢。<br>小心别画出第三条边，那等于把格子送给对方。</p>
  </section>
  <section id="game" class="hidden"><div class="topbar"><div id="roomtag" class="roomtag"></div><div class="row" style="gap:6px"><button id="copy" class="ghost small">复制邀请</button><button id="leave" class="ghost small">离开</button></div></div>
    <div class="seats"><div id="seat0" class="seat"></div><div id="seat1" class="seat"></div></div>
    <div class="stage"><div id="round" class="eyebrow"></div><div id="status" class="status" role="status" aria-live="polite"></div><svg id="board" viewBox="0 0 340 340" aria-label="点格棋棋盘"></svg></div>
    <p class="hint">点两个点之间的空白处画线。</p><button id="again" class="ghost block">重开一局</button><div id="reacts" class="reacts"></div>
  </section>
</div>
<div id="modal" class="modal hidden"><div class="card"><h3 id="mT"></h3><p id="mP"></p><div class="row" id="mBtns"></div></div></div><div id="toast" class="toast"></div>
<script src="../common.js?v=1794610000"></script>
<script src="../mqtt.min.js"></script>
<script>
(() => {
  'use strict';
  const ui=FB.ui,$=id=>document.getElementById(id);
  const N=4,H=(N+1)*N,L=2*N*(N+1),G=70,O=30,EMO=['🐱','🐶'];
  // line ids: 0..H-1 horizontal (row r 0..N, col c 0..N-1), H..L-1 vertical (row r 0..N-1, col c 0..N)
  const sides=(r,c)=>[r*N+c,(r+1)*N+c,H+r*(N+1)+c,H+r*(N+1)+c+1];
  const boxesOf=l=>{const r=[];if(l<H){const y=Math.floor(l/N),x=l%N;if(y>0)r.push([y-1,x]);if(y<N)r.push([y,x]);}else{const k=l-H,y=Math.floor(k/(N+1)),x=k%(N+1);if(x>0)r.push([y,x-1]);if(x<N)r.push([y,x]);}return r;};
  let mode=null,net=null,code='',st=null,pos=null,ready=false,initT=null,botT=null,celebrated='';
  const me=()=>mode==='online'?net.myId:'me';
  const nameOf=id=>mode==='pass'?(id==='me'?'一号玩家':'二号玩家'):id==='bot'?'电脑':id===me()?'你':net.nameOf(id);
  const newer=s=>!st||s.game>st.game||(s.game===st.game&&s.v>st.v);
  function replay(s){
    const line=Array(L).fill(-1),box=Array(N*N).fill(-1);let turn=s.game%2,last=-1,again=false;
    for(const m of s.moves){
      if(!Number.isInteger(m)||m<0||m>=L||line[m]>=0)return null;
      line[m]=turn;last=m;let got=0;
      for(const [y,x] of boxesOf(m))if(box[y*N+x]<0&&sides(y,x).every(i=>line[i]>=0)){box[y*N+x]=turn;got++;}
      again=got>0;if(!got)turn=1-turn;
    }
    const cnt=[box.filter(x=>x===0).length,box.filter(x=>x===1).length],done=s.moves.length===L;
    return {line,box,turn,last,again,cnt,done,winner:done?(cnt[0]===cnt[1]?-1:cnt[0]>cnt[1]?0:1):null};
  }
  function valid(s){return !!(s&&Number.isSafeInteger(s.game)&&s.game>=0&&s.game<=1e9&&Number.isSafeInteger(s.v)&&Array.isArray(s.moves)&&s.moves.length<=L&&s.v===s.moves.length&&Array.isArray(s.players)&&s.players.length===2&&s.players[0]!==s.players[1]&&s.players.every(id=>typeof id==='string'&&/^[a-z0-9]{1,16}$/.test(id))&&replay(s));}
  const compatible=s=>!st||s.game>st.game||(s.players.join('|')===st.players.join('|')&&st.moves.every((x,i)=>s.moves[i]===x));
  const seatsHere=()=>mode!=='online'||(ready&&net.connected()&&st&&st.players.every(id=>id===me()||net.alive().includes(id)));
  function accept(s,send){
    if(!valid(s)||!newer(s)||!compatible(s))return;
    const old=st;st={game:s.game,v:s.v,players:s.players.slice(),moves:s.moves.slice()};pos=replay(st);
    clearTimeout(botT);botT=null;if(!old||old.game!==st.game)ui.close();
    render();if(send&&mode==='online')net.setState(st);afterChange();
  }
  function draw(l,by){
    if(!st||pos.done||st.players[pos.turn]!==by||!seatsHere()||pos.line[l]>=0)return;
    accept({...st,v:st.v+1,moves:st.moves.concat(l)},true);
  }
  function restart(){
    if(mode==='online'){
      if(!ready||!net.connected())return;
      if(st){if(!st.players.includes(me())||!seatsHere()){ui.toast('等两位玩家都在线再开');return;}if(me()!==st.players[0]){net.emit('restart',{game:st.game});return;}}
      else if(net.order().length!==2||net.order()[0]!==me())return;
    }
    accept({game:st?st.game+1:0,v:0,players:st?st.players.slice():mode==='online'?net.order():['me',mode==='bot'?'bot':'p2'],moves:[]},true);
  }
  // Bot: take any box it can; otherwise draw a line that does not give away a third side; otherwise give away as little as possible.
  function bestMove(line){
    const free=[];for(let l=0;l<L;l++)if(line[l]<0)free.push(l);
    const drawn=(y,x)=>sides(y,x).filter(i=>line[i]>=0).length;
    const take=free.filter(l=>boxesOf(l).some(([y,x])=>drawn(y,x)===3));if(take.length)return take[0];
    const safe=free.filter(l=>boxesOf(l).every(([y,x])=>drawn(y,x)<2));if(safe.length)return safe[Math.floor(Math.random()*safe.length)];
    let best=Infinity,pick=free[0];
    for(const l of free){const t=line.slice();t[l]=0;let gift=0,changed=true;const tb=new Set();
      while(changed){changed=false;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const s=sides(y,x),open=s.filter(i=>t[i]<0);if(open.length===1&&!tb.has(y*N+x)){t[open[0]]=0;tb.add(y*N+x);gift++;changed=true;}}}
      if(gift<best){best=gift;pick=l;}}
    return pick;
  }
  function afterChange(){
    if(pos.done){const key=st.game+':'+st.v;if(celebrated!==key){celebrated=key;if(pos.winner>=0)ui.burst('🎉');}return;}
    if(mode==='bot'&&st.players[pos.turn]==='bot'){const g=st.game,v=st.v;botT=setTimeout(()=>{botT=null;if(st.game===g&&st.v===v)draw(bestMove(pos.line),'bot');},pos.again?450:700);}
  }
  const NS='http://www.w3.org/2000/svg',el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  function render(){
    ui.roomTag(mode==='online'?net:null,code,mode==='pass'?'同一台手机 · 双人轮流':'和电脑玩');$('copy').classList.toggle('hidden',mode!=='online');$('reacts').classList.toggle('hidden',mode!=='online');
    const can=!!st&&!pos.done&&seatsHere()&&(mode==='pass'||st.players[pos.turn]===me());
    $('status').className='status'+(can?' go':'');
    if(!st)$('status').textContent=net&&!net.connected()?'连接中…':'等 TA 进入同一个房间…';
    else if(pos.done)$('status').textContent=pos.winner<0?'8 比 8，平手！🤝':nameOf(st.players[pos.winner])+'以 '+Math.max(...pos.cnt)+' 比 '+Math.min(...pos.cnt)+' 赢啦！🎉';
    else if(mode==='online'&&!st.players.includes(me()))$('status').textContent='本局已有两位玩家，你正在观战';
    else if(!seatsHere())$('status').textContent=!net.connected()?'连接断开，正在重连…':!ready?'正在同步房间…':'等 TA 回来，棋盘会留在这里';
    else $('status').textContent=(pos.again?'占到格子！':'')+(can?'轮到'+(mode==='pass'?nameOf(st.players[pos.turn]):'你')+(pos.again?'再画一条':'画一条线'):nameOf(st.players[pos.turn])+(pos.again?'再画一条…':'正在想…'));
    $('round').textContent=st?'第 '+(st.game+1)+' 局 · 已画 '+st.moves.length+' / '+L+' 条':'';
    const COL=['#d9586b','#3f86c9'];
    for(let p=0;p<2;p++){const e=$('seat'+p),sw=document.createElement('span');sw.className='sw';sw.style.background=COL[p];const n=document.createElement('b');n.textContent=st?pos.cnt[p]:0;
      e.replaceChildren(sw,document.createTextNode(EMO[p]+' '+(st?nameOf(st.players[p])+(st.game%2===p?' · 先手':''):(p?'等 TA 来':'先手玩家'))),n);e.classList.toggle('active',!!st&&!pos.done&&pos.turn===p);}
    const svg=$('board');svg.replaceChildren();
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const o=pos?pos.box[y*N+x]:-1;svg.appendChild(el('rect',{x:O+x*G+4,y:O+y*G+4,width:G-8,height:G-8,rx:8,class:'box'+(o>=0?' p'+o:''),fill:'transparent'}));if(o>=0){const t=el('text',{x:O+x*G+G/2,y:O+y*G+G/2,class:'bx'});t.textContent=EMO[o];svg.appendChild(t);}}
    for(let l=0;l<L;l++){
      let x1,y1,x2,y2;if(l<H){const y=Math.floor(l/N),x=l%N;x1=O+x*G;y1=O+y*G;x2=x1+G;y2=y1;}else{const k=l-H,y=Math.floor(k/(N+1)),x=k%(N+1);x1=O+x*G;y1=O+y*G;x2=x1;y2=y1+G;}
      const o=pos?pos.line[l]:-1;
      if(o<0&&can){const h=el('line',{x1,y1,x2,y2,class:'hit','data-l':l});h.addEventListener('click',()=>draw(l,mode==='pass'?st.players[pos.turn]:me()));svg.appendChild(h);}
      svg.appendChild(el('line',{x1:x1+(l<H?7:0),y1:y1+(l<H?0:7),x2:x2-(l<H?7:0),y2:y2-(l<H?0:7),class:'ln'+(o>=0?' p'+o:' free')+(pos&&pos.last===l?' last':''),'pointer-events':'none'}));
    }
    for(let y=0;y<=N;y++)for(let x=0;x<=N;x++)svg.appendChild(el('circle',{cx:O+x*G,cy:O+y*G,r:6,class:'dot'}));
    $('again').textContent=pos&&pos.done?'再来一局 · 交换先后手':'重开一局';$('again').disabled=mode==='online'&&(!st||!seatsHere()||!st.players.includes(me()));
  }
  function scheduleInit(){clearTimeout(initT);initT=setTimeout(()=>{ready=true;if(!st)restart();render();},1200);}
  $('again').onclick=()=>{if(st&&!pos.done&&st.moves.length)ui.modal('重开一局？','当前棋盘会清空，并交换先后手。',[{label:'取消'},{label:'重开',primary:true,fn:restart}]);else restart();};
  $('copy').onclick=()=>ui.copyInvite(code,'点格棋');$('leave').onclick=()=>{if(net)net.close();location.href='../'+(mode==='online'?'#'+code:'');};
  ui.reacts(()=>net,9);
  function show(){$('lobby').classList.add('hidden');$('game').classList.remove('hidden');}
  function local(kind){mode=kind;show();restart();}
  $('pass').onclick=()=>local('pass');
  ui.lobby({onJoin(c){mode='online';code=c;show();net=FB.net('dots',c,{
    onConn(ok){if(ok)scheduleInit();else ready=false;render();},onPeers(joined){if(joined.length)scheduleInit();render();},onState(s){accept(s,false);},
    onEvent(d){if(!st||!st.players.includes(d.from))return;if(d.t==='react'&&ui.EMO.slice(0,9).includes(d.e))ui.float(d.e);if(d.t==='restart'&&d.game===st.game&&me()===st.players[0])restart();}
  });render();},onLocal(){local('bot');}});
})();
</script>
</body>
</html>
