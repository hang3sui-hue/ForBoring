<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>反应力测试 · ForBoring</title>
<link rel="stylesheet" href="../common.css?v=1794620000">
<style>
  .stage{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 12px;text-align:center}
  .eyebrow{font-size:12px;color:var(--muted);letter-spacing:1px}.status{line-height:1.6;min-height:26px;margin:8px 0 14px}
  .seats{display:flex;gap:10px;margin:12px 0}.seat{flex:1;min-width:0;padding:10px 8px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-size:13px;text-align:center;overflow-wrap:anywhere}.seat.active{background:var(--accent-soft);border-color:var(--accent)}.seat b{display:block;font-size:18px;margin-top:2px}
  .reacts button{font-size:20px;padding:6px 1px}
  .pads{display:flex;flex-direction:column;gap:10px}
  .pad{border:none;width:100%;min-height:230px;border-radius:20px;font-size:22px;font-weight:800;color:#fff;background:#b9aa9a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:background .08s}
  .pad small{font-size:13px;font-weight:500;opacity:.9}
  .pad.wait{background:#d9586b}.pad.go{background:#3f9d6b}.pad.foul{background:#2b2420}.pad.res{background:#efe5d8;color:var(--ink)}
  .pass .pad{min-height:170px}.pad.flip{transform:rotate(180deg)}
  .best{font-size:12px;color:var(--muted);margin-top:10px}

</style>
</head>
<body>
<div class="wrap">
  <section id="lobby"><a class="back" href="../">‹ 返回主页</a><h1>反应力测试</h1><p class="sub">屏幕先是红色，一变绿就马上按。<br>单人测 5 次，双人联机先拿 3 分的赢 🚦</p>
    <div class="card"><label for="code">房间号（字母或数字）</label><div class="row"><input id="code" maxlength="12" placeholder="比如 love520" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="rand" class="ghost" aria-label="随机房间号">🎲</button></div><button id="join" class="primary block">双人联机 · 进入房间</button><div class="divider">或者</div><button id="local" class="ghost block" style="margin-top:6px">单人玩</button></div>
    <p class="hint">变绿之前按下去算抢跑：单人重测，双人这轮判输。<br>反应时间在各自的手机上计算，网速快慢不影响结果。</p>
  </section>
  <section id="game" class="hidden"><div class="topbar"><div id="roomtag" class="roomtag"></div><div class="row" style="gap:6px"><button id="copy" class="ghost small">复制邀请</button><button id="leave" class="ghost small">离开</button></div></div>
    <div class="seats"><div id="seat0" class="seat"></div><div id="seat1" class="seat"></div></div>
    <div class="stage"><div id="round" class="eyebrow"></div><div id="status" class="status" role="status" aria-live="polite"></div><div id="board" class="pads"></div><div id="best" class="best"></div></div>
    <p class="hint" id="caption">平均人的反应时间在 200～300 毫秒之间。</p><button id="again" class="ghost block">重开一局</button><div id="reacts" class="reacts"></div>
  </section>
</div>
<div id="modal" class="modal hidden"><div class="card"><h3 id="mT"></h3><p id="mP"></p><div class="row" id="mBtns"></div></div></div><div id="toast" class="toast"></div>
<script src="../common.js?v=1794620000"></script>
<script src="../mqtt.min.js"></script>
<script src="../rt.js?v=1794700000"></script>
<script>
(() => {
'use strict';

const $=id=>document.getElementById(id),ui=FB.ui,WIN=3;
let L=null,score=[0,0],trials=[],n=0,phase='idle',delay=0,t0=0,res={},greenT=null,nextT=null,timeoutT=null,best=null;
try{best=+localStorage.getItem('fb_react_best')||null;}catch(_){}
const pair=()=>L.pair(),idx=id=>pair().indexOf(id);
function seats(){for(let p=0;p<2;p++){const id=pair()[p],e=$('seat'+p),b=document.createElement('b');e.classList.toggle('hidden',L.mode==='solo'&&p===1);b.textContent=L.mode==='solo'?trials.length+' / 5 次':score[p];e.replaceChildren(document.createTextNode(id?L.nameOf(id):'等 TA 来'),b);}}
function pads(){
  const box=$('board');box.replaceChildren();box.className='pads'+(L.mode==='pass'?' pass':'');
  const who=L.mode==='pass'?[1,0]:[idx(L.me())];
  who.forEach(p=>{if(p<0)return;const b=document.createElement('button');b.className='pad'+(L.mode==='pass'&&p===1?' flip':'');b.dataset.p=p;b.addEventListener('pointerdown',e=>{e.preventDefault();tap(pair()[p]);});box.appendChild(b);});
  paint();
}
function paint(){
  document.querySelectorAll('.pad').forEach(b=>{
    const id=pair()[+b.dataset.p],r=res[id];let cls='',t='',s='';
    if(phase==='wait'){cls=r===-1?'foul':'wait';t=r===-1?'抢跑了！':'等它变绿…';s=r===-1?(L.mode==='solo'?'不计成绩，重新测试':'这一轮判输'):'变绿了再按';}
    else if(phase==='go'){cls=r!==undefined?'res':'go';t=r!==undefined?(r<0?'抢跑了':r+' 毫秒'):'按！';s=r!==undefined?(L.mode==='solo'?'下一次准备中':'等对方…'):'';}
    else if(phase==='result'||phase==='over'){cls='res';t=r===undefined?'—':r<0?'抢跑':r+' 毫秒';s=lastMsg;}
    else{cls='res';t=L.both()?'准备…':'等 TA 进来';s=L.watching()?'房间已满，你在观战':'';}
    b.className='pad '+cls+(L.mode==='pass'&&+b.dataset.p===1?' flip':'');b.replaceChildren(document.createTextNode(t));if(s){const m=document.createElement('small');m.textContent=s;b.appendChild(m);}
  });
  $('best').textContent=best?'你的最快纪录：'+best+' 毫秒':'';
}
let lastMsg='';
function status(t){$('status').textContent=t;}
function arm(k,d){
  clearTimeout(greenT);clearTimeout(timeoutT);n=k;delay=d;res={};phase='wait';status((L.mode==='solo'?'第 '+(trials.length+1)+' / 5 次':'第 '+(n+1)+' 轮')+' · 屏幕变绿就按');paint();
  greenT=setTimeout(()=>{if(phase!=='wait'||n!==k)return;phase='go';t0=performance.now();paint();
    timeoutT=setTimeout(()=>{pair().forEach(id=>{if(res[id]===undefined&&(L.mode!=='online'||id===L.myId))record(id,3000,true);});},3000);},d);
}
function tap(id){
  if(!id||res[id]!==undefined)return;if(L.mode==='online'&&id!==L.myId)return;
  if(phase==='wait')record(id,-1,true);else if(phase==='go'){const ms=Math.round(performance.now()-t0);record(id,ms,true);if(id===L.me()&&(!best||ms<best)){best=ms;try{localStorage.setItem('fb_react_best',ms);}catch(_){}}}
}
function record(id,ms,send){
  if(res[id]!==undefined)return;res[id]=ms;if(send&&L.mode==='online')L.emit('res',{n,ms});paint();check();
}
function check(){
  if(L.mode==='solo'){
    const ms=res[L.me()];if(ms===undefined||phase==='result'||phase==='over')return;
    clearTimeout(greenT);clearTimeout(timeoutT);
    if(ms>=0&&ms<3000)trials.push(ms);
    const over=trials.length===5;phase=over?'over':'result';seats();
    lastMsg=over?'测试完成 · 平均 '+Math.round(trials.reduce((a,b)=>a+b,0)/5)+' 毫秒 · 最快 '+Math.min(...trials)+' 毫秒':ms<0?'抢跑不计成绩，稍后重测':ms>=3000?'超过 3 秒未点击，稍后重测':ms+' 毫秒 · 已完成 '+trials.length+' / 5 次';
    status(lastMsg);paint();if(!over)nextT=setTimeout(()=>startRound(n+1),1600);return;
  }
  const [a,b]=pair();if(res[a]===undefined||res[b]===undefined||phase==='result'||phase==='over')return;
  clearTimeout(greenT);clearTimeout(timeoutT);
  const ra=res[a],rb=res[b];let w=-1;
  if(ra<0&&rb>=0)w=1;else if(rb<0&&ra>=0)w=0;else if(ra>=0&&rb>=0&&ra!==rb)w=ra<rb?0:1;
  if(w>=0)score[w]++;seats();
  lastMsg=w<0?'这轮平手':L.nameOf(pair()[w])+'拿下这一轮';
  const over=score[0]>=WIN||score[1]>=WIN;phase=over?'over':'result';
  status(over?L.nameOf(pair()[score[0]>=WIN?0:1])+'先拿到 '+WIN+' 分，赢啦！🎉':lastMsg+' · '+score[0]+' : '+score[1]);
  if(over)ui.burst('🎉');paint();
  if(!over&&L.isHost())nextT=setTimeout(()=>startRound(n+1),2200);
}
function startRound(k){if(!L.both())return;const d=1500+Math.floor(Math.random()*3500);if(L.mode==='online')L.emit('arm',{n:k,d});arm(k,d);}
function newMatch(send){clearTimeout(nextT);clearTimeout(greenT);clearTimeout(timeoutT);score=[0,0];trials=[];res={};lastMsg='';seats();phase='idle';paint();if(send&&L.mode==='online')L.emit('match',{});if(L.isHost())nextT=setTimeout(()=>startRound(0),1500);}
$('again').textContent='重新开始';
$('again').onclick=()=>newMatch(true);
L=FBLive({key:'reaction',name:'反应力测试',solo:true,localLabel:'单人玩',passLabel:false,
  start(l){pads();seats();$('caption').textContent=l.mode==='solo'?'完成 5 次有效测试，查看平均和最快反应时间；抢跑或超时会重测。':'变绿后尽快按，先拿到 3 分的赢。';if(l.mode!=='online')newMatch(false);else status('等 TA 进入同一个房间…');},
  peers(l){seats();pads();if(l.both()&&phase==='idle'&&l.isHost()){clearTimeout(nextT);nextT=setTimeout(()=>startRound(0),1500);status('人齐了，马上开始');}
    else if(!l.both()&&phase!=='over'){phase='idle';clearTimeout(nextT);status('等 TA 进入同一个房间…');paint();}},
  event(d,l){
    if(!pair().includes(d.from))return;
    if(d.t==='arm'&&Number.isInteger(d.n)&&d.d>=500&&d.d<=8000){clearTimeout(nextT);if(d.n===0){score=[0,0];seats();}arm(d.n,d.d);}
    else if(d.t==='res'&&d.n===n&&(d.ms===-1||(Number.isInteger(d.ms)&&d.ms>=0&&d.ms<=3000)))record(d.from,d.ms,false);
    else if(d.t==='match')newMatch(false);
  }});

})();
</script>
</body>
</html>
