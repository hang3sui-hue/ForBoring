<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>井字棋（OX）· ForBoring</title>
<link rel="stylesheet" href="../common.css?v=1794503478">
<style>
  .stage{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 14px;text-align:center}
  .eyebrow{font-size:12px;color:var(--muted);letter-spacing:1px}.status{line-height:1.6;min-height:26px;margin:10px 0 16px}
  .seats{display:flex;gap:10px;margin:12px 0}.seat{flex:1;min-width:0;padding:12px 8px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-size:13px;text-align:center;overflow-wrap:anywhere}.seat.active{background:var(--accent-soft);border-color:var(--accent)}.seat i{font-style:normal;font-size:20px;font-weight:700;margin-right:6px;vertical-align:-1px}.seat .x{color:var(--accent)}.seat .o{color:#b78232}
  .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;max-width:366px;margin:0 auto}
  .cell{position:relative;aspect-ratio:1;min-width:0;padding:0;border:1.5px solid var(--line);border-radius:16px;background:#fffdf9;display:flex;align-items:center;justify-content:center}.cell:disabled{opacity:1;cursor:default}.cell:not(:disabled):hover{background:var(--accent-soft);border-color:var(--accent)}.cell:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.cell.won{background:#f8e0e4;border-color:var(--accent)}.cell.won.gold{background:#faebcc;border-color:#d1a45f}.cell.last:after{content:'';position:absolute;bottom:8px;width:4px;height:4px;background:var(--muted);border-radius:50%}.num{position:absolute;right:9px;bottom:7px;font-size:10px;color:#b5a799;font-weight:400}
  .mark{display:block;position:relative;width:56%;height:56%}.mark.o{border:7px solid #d2a155;border-radius:50%}.mark.x:before,.mark.x:after{content:'';position:absolute;left:calc(50% - 3.5px);top:-8%;height:116%;width:7px;border-radius:8px;background:var(--accent);transform:rotate(45deg)}.mark.x:after{transform:rotate(-45deg)}.mark.pop{animation:pop .22s ease-out}@keyframes pop{from{transform:scale(.55);opacity:.2}to{transform:scale(1);opacity:1}}
  .private{min-height:16px;font-size:11px;color:var(--muted);opacity:.3;margin-top:12px}.hint{text-align:center}.reacts button{font-size:20px;padding:6px 1px}
  @media(prefers-reduced-motion:reduce){.mark.pop{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <section id="lobby"><a class="back" href="../">‹ 返回主页</a><h1>井字棋（OX）</h1><p class="sub">你画一个圈，我落一个叉。<br>九个小格子，先连成三个就赢啦 ⭕</p>
    <div class="card"><label for="code">房间号（字母或数字）</label><div class="row"><input id="code" maxlength="12" placeholder="比如 love520" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="rand" class="ghost" aria-label="随机房间号">🎲</button></div><button id="join" class="primary block">进入房间</button><div class="divider">或者</div><button id="local" class="ghost block" style="margin-top:6px">先和电脑玩</button><button id="pass" class="ghost block">同一台手机轮流玩</button></div>
    <p class="hint">横着、竖着、斜着，连成三个都算赢。<br>先手执 ×，每局交换先后手。</p>
  </section>
  <section id="game" class="hidden"><div class="topbar"><div id="roomtag" class="roomtag"></div><div class="row" style="gap:6px"><button id="copy" class="ghost small">复制邀请</button><button id="leave" class="ghost small">离开</button></div></div>
    <div class="seats"><div id="seat0" class="seat"></div><div id="seat1" class="seat"></div></div>
    <div class="stage"><div id="round" class="eyebrow">九个格子，等你落下一笔</div><div id="status" class="status" role="status" aria-live="polite"></div><div id="board" class="board" aria-label="井字棋棋盘"></div><div id="private" class="private"></div></div>
    <p class="hint" id="caption">点空格落子，先连成三个就赢。</p><button id="again" class="ghost block">重开一局</button><div id="reacts" class="reacts"></div>
  </section>
</div>
<div id="modal" class="modal hidden"><div class="card"><h3 id="mT"></h3><p id="mP"></p><div class="row" id="mBtns"></div></div></div><div id="toast" class="toast"></div>
<script src="../common.js?v=1794620000"></script>
<script src="../mqtt.min.js"></script>
<script>
(() => {
  'use strict';
  const ui=FB.ui,$=id=>document.getElementById(id);
  const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const POS=['左上','上中','右上','左中','正中','右中','左下','下中','右下'],PREFERRED=[4,0,2,6,8,1,3,5,7];
  let mode=null,net=null,code='',st=null,position=null,ready=false,initT=null,botT=null,xray=false,seq=[],celebrated='';
  const me=()=>mode==='online'?net.myId:'me';
  const nameOf=id=>mode==='pass'?(id==='me'?'一号玩家':'二号玩家'):id==='bot'?'电脑':id===me()?'你':net.nameOf(id);
  const newer=s=>!st||s.game>st.game||(s.game===st.game&&s.v>st.v);
  function result(b){
    const lines=LINES.filter(a=>b[a[0]]&&a.every(i=>b[i]===b[a[0]]));
    return {winner:lines.length?b[lines[0][0]]:0,win:[...new Set(lines.flat())]};
  }
  // The board, turn and result are derived by replaying the whole shared game.
  // Reject occupied cells and any moves after a win, rather than trusting a board.
  function replay(s){
    const b=Array(9).fill(0);let r={winner:0,win:[]};
    for(let i=0;i<s.moves.length;i++){const cell=s.moves[i];if(!Number.isInteger(cell)||cell<0||cell>8||b[cell]||r.winner)return null;b[cell]=(s.game+i)%2+1;r=result(b);}
    return {b,...r,done:!!r.winner||s.moves.length===9,turn:(s.game+s.moves.length)%2,last:s.moves.length?s.moves[s.moves.length-1]:-1};
  }
  function valid(s){
    return !!(s&&Number.isSafeInteger(s.game)&&s.game>=0&&s.game<=1e9&&Number.isSafeInteger(s.v)&&Array.isArray(s.moves)&&s.moves.length<=9&&s.v===s.moves.length&&Array.isArray(s.players)&&s.players.length===2&&s.players[0]!==s.players[1]&&s.players.every(id=>typeof id==='string'&&/^[a-z0-9]{1,16}$/.test(id))&&replay(s));
  }
  const compatible=s=>!st||s.game>st.game||(s.players.join('|')===st.players.join('|')&&st.moves.every((x,i)=>s.moves[i]===x));
  const seatsHere=()=>mode!=='online'||(ready&&net.connected()&&st&&st.players.every(id=>id===me()||net.alive().includes(id)));
  function accept(s,send){
    if(!valid(s)||!newer(s)||!compatible(s))return;
    const old=st;st={game:s.game,v:s.v,players:s.players.slice(),moves:s.moves.slice()};position=replay(st);
    clearTimeout(botT);botT=null;if(!old||old.game!==st.game)ui.close();
    render(!!old&&old.game===st.game&&st.v===old.v+1);
    if(send&&mode==='online')net.setState(st);
    afterChange();
  }
  function place(cell,by){
    if(!st||position.done||!Number.isInteger(cell)||cell<0||cell>8||position.b[cell]||st.players[position.turn]!==by||!seatsHere())return;
    const moves=st.moves.concat(cell);accept({...st,v:st.v+1,moves},true);
  }
  function restart(){
    if(mode==='online'){
      if(!ready||!net.connected())return;
      if(st){if(!st.players.includes(me())||!seatsHere()){ui.toast('等两位玩家都在线再开');return;}if(me()!==st.players[0]){net.emit('restart',{game:st.game});return;}}
      else if(net.order().length!==2||net.order()[0]!==me())return;
    }
    accept({game:st?st.game+1:0,v:0,players:st?st.players.slice():mode==='online'?net.order():['me',mode==='bot'?'bot':'p2'],moves:[]},true);
  }
  // Full minimax: take a win, block a loss, and prefer the centre/corners on ties.
  const memo=new Map();
  function solve(b,turn,root){
    const r=result(b),empty=b.filter(x=>!x).length;if(r.winner)return r.winner===root?10+empty:-10-empty;if(!empty)return 0;
    const key=b.join('')+turn+root;if(memo.has(key))return memo.get(key);
    let score=turn===root?-Infinity:Infinity;
    for(const cell of PREFERRED){if(b[cell])continue;b[cell]=turn;const value=solve(b,3-turn,root);b[cell]=0;score=turn===root?Math.max(score,value):Math.min(score,value);}
    memo.set(key,score);return score;
  }
  function bestMove(board,p){
    const b=board.slice();let best=-Infinity,choice=-1;if(result(b).winner)return choice;
    for(const cell of PREFERRED){if(b[cell])continue;b[cell]=p;const score=solve(b,3-p,p);b[cell]=0;if(score>best){best=score;choice=cell;}}
    return choice;
  }
  function afterChange(){
    if(position.done){const key=st.game+':'+st.v;if(celebrated!==key){celebrated=key;if(position.winner)ui.burst('🎉');}return;}
    if(mode==='bot'&&st.players[position.turn]==='bot'){
      const game=st.game,v=st.v;botT=setTimeout(()=>{botT=null;if(st.game===game&&st.v===v)place(bestMove(position.b,position.turn+1),'bot');},600);
    }
  }
  function render(animate=false){
    ui.roomTag(mode==='online'?net:null,code,mode==='pass'?'同一台手机 · 双人轮流':'和电脑玩');$('copy').classList.toggle('hidden',mode!=='online');$('reacts').classList.toggle('hidden',mode!=='online');
    const can=!!st&&!position.done&&seatsHere()&&(mode==='pass'||st.players[position.turn]===me());
    $('status').className='status'+(can?' go':'');
    if(!st)$('status').textContent=net&&!net.connected()?'连接中…':'等 TA 进入同一个房间…';
    else if(position.done)$('status').textContent=position.winner?nameOf(st.players[position.winner-1])+'连成三个，赢啦！🎉':'谁也没让着谁，这局平手 🤝';
    else if(mode==='online'&&!st.players.includes(me()))$('status').textContent='本局已有两位玩家，你正在观战';
    else if(!seatsHere())$('status').textContent=!net.connected()?'连接断开，正在重连…':!ready?'正在同步房间…':'等 TA 回来，棋盘会留在这里';
    else $('status').textContent=can?'轮到'+(mode==='pass'?nameOf(st.players[position.turn]):'你')+'，点空格落子':nameOf(st.players[position.turn])+'正在想下一步…';
    $('round').textContent=st?'第 '+(st.game+1)+' 局 · 已落 '+st.moves.length+' 步':'九个格子，等你落下一笔';
    for(let p=0;p<2;p++){
      const e=$('seat'+p),first=st?st.game%2===p:p===0,symbol=document.createElement('i');symbol.className=first?'x':'o';symbol.textContent=first?'×':'○';e.replaceChildren(symbol,document.createTextNode(st?nameOf(st.players[p])+' · '+(first?'先手':'后手'):(p?'等 TA 来':'先手玩家')));e.classList.toggle('active',!!st&&!position.done&&position.turn===p);
    }
    $('board').replaceChildren();
    for(let i=0;i<9;i++){
      const b=document.createElement('button'),value=position?position.b[i]:0,cross=st&&value-1===st.game%2;b.className='cell'+(position&&position.win.includes(i)?' won'+(cross?'':' gold'):'')+(position&&position.last===i?' last':'');b.dataset.cell=i;b.disabled=!can||!!value;
      b.setAttribute('aria-label','第 '+(Math.floor(i/3)+1)+' 行第 '+(i%3+1)+' 列，'+(value?(cross?'叉':'圈'):'空位'));
      if(value){const mark=document.createElement('span');mark.className='mark '+(cross?'x':'o')+(animate&&position.last===i?' pop':'');mark.setAttribute('aria-hidden','true');b.appendChild(mark);}else{const n=document.createElement('span');n.className='num';n.textContent=i+1;n.setAttribute('aria-hidden','true');b.appendChild(n);}$('board').appendChild(b);
    }
    $('private').textContent=mode==='online'&&xray&&can?'· '+POS[bestMove(position.b,position.turn+1)]:'';
    $('again').textContent=position&&position.done?'再来一局 · 交换先后手':'重开一局';$('again').disabled=mode==='online'&&(!st||!seatsHere()||!st.players.includes(me()));
    $('caption').textContent=position&&position.done?'再来一局，先后手和圈叉都会互换。':'横、竖、斜连成三个就赢。小点标记刚落下的一步。';
  }
  function scheduleInit(){clearTimeout(initT);initT=setTimeout(()=>{ready=true;if(!st)restart();render();},1200);}
  $('board').onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled)place(+b.dataset.cell,mode==='pass'?st.players[position.turn]:me());};
  $('again').onclick=()=>{if(st&&!position.done&&st.moves.length)ui.modal('重开一局？','当前棋盘会清空，并交换先后手。',[{label:'取消'},{label:'重开',primary:true,fn:restart}]);else restart();};
  $('copy').onclick=()=>ui.copyInvite(code,'井字棋');$('leave').onclick=()=>{if(net)net.close();location.href='../'+(mode==='online'?'#'+code:'');};
  ui.reacts(()=>net,9,i=>{if(mode!=='online')return;seq.push(i);if(seq.length>7)seq.shift();if(seq.join('')==='0014785'){seq=[];xray=!xray;render();}});
  function show(){$('lobby').classList.add('hidden');$('game').classList.remove('hidden');}
  function local(kind){mode=kind;show();restart();}
  $('pass').onclick=()=>local('pass');
  ui.lobby({onJoin(c){mode='online';code=c;show();net=FB.net('tictactoe',c,{
    onConn(ok){if(ok)scheduleInit();else ready=false;render();},onPeers(joined){if(joined.length)scheduleInit();render();},onState(s){accept(s,false);},
    onEvent(d){if(!st||!st.players.includes(d.from))return;if(d.t==='react'&&ui.EMO.slice(0,9).includes(d.e))ui.float(d.e);if(d.t==='restart'&&d.game===st.game&&me()===st.players[0])restart();}
  });render();},onLocal(){local('bot');}});
})();
</script>
</body>
</html>
