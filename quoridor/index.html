<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>步步为营 · ForBoring</title>
<link rel="stylesheet" href="../common.css?v=1794503478">
<style>
  .stage{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 10px;text-align:center}
  .eyebrow{color:var(--muted);font-size:12px;letter-spacing:2px;margin-bottom:6px}
  .seats{display:flex;gap:10px;margin:12px 0}.seat{flex:1;min-width:0;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 7px;text-align:center;font-size:13px;overflow-wrap:anywhere}.seat.active{border-color:var(--accent);background:var(--accent-soft)}
  .stone{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:6px;vertical-align:-2px}.c0{background:#d9586b}.c1{background:#e9ad51}
  .wl{display:block;color:var(--muted);font-size:12px;margin-top:3px}
  .qb{--p:11.1111%;position:relative;width:100%;aspect-ratio:1;background:#dbc6ae;border-radius:14px;box-shadow:inset 0 2px 5px #9f80632b;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  .cell{position:absolute;width:calc(var(--p) - 5px);height:calc(var(--p) - 5px);border-radius:6px;background:#f6efe6;box-shadow:inset 0 1px 3px #7b563e22;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .cell.goalme{background:#f9e3e6}.cell.goalop{background:#f8ecd6}
  .cell.can::after{content:'';width:30%;height:30%;border-radius:50%;background:var(--accent);opacity:.45}
  .pawn{width:72%;height:72%;border-radius:50%;box-shadow:inset 0 2px 4px #ffffff70,0 2px 4px #704e3340;position:relative;z-index:2;transition:transform .15s}
  .pawn.mine{outline:2px solid #fff;outline-offset:-4px}
  .wall{position:absolute;background:#7a4f33;border-radius:4px;z-index:3;box-shadow:0 1px 3px #0004;pointer-events:none}
  .wall.last{background:#a0603c;box-shadow:0 0 0 2px #fff9e5}
  .wall.ghost{background:#4caf7acc}.wall.ghost.bad{background:#d9586bcc}
  .tools{display:flex;gap:8px;margin-top:12px}.tools button{flex:1;padding:10px 6px;font-size:14px}
  .tools button.on{background:var(--accent);color:#fff}
  .confirm{display:flex;gap:8px;margin-top:8px}.confirm button{flex:1;padding:10px}
  .status{line-height:1.6;margin:6px 0 10px}.caption{font-size:12px;color:var(--muted);line-height:1.7;margin-top:10px}.reacts button{font-size:20px;padding:6px 1px}
</style>
</head>
<body>
<div class="wrap">
  <section id="lobby">
    <a class="back" href="../">‹ 返回主页</a><h1>步步为营</h1>
    <p class="sub">每回合二选一：走一步，或者放一堵墙挡住 TA。<br>谁先走到对面那一排谁赢 🚧</p>
    <div class="card"><label for="code">房间号（字母或数字）</label><div class="row"><input id="code" maxlength="12" placeholder="比如 love520" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="rand" class="ghost" aria-label="随机房间号">🎲</button></div><button id="join" class="primary block">进入房间</button><div class="divider">或者</div><button id="local" class="ghost block" style="margin-top:6px">先和电脑玩</button></div>
    <p class="hint">9×9 棋盘，每人 10 堵墙，每堵墙挡两格。墙不能把路完全封死。两人面对面时可以跳过对方，后面有墙就斜着走。</p>
  </section>
  <section id="game" class="hidden">
    <div class="topbar"><div class="roomtag" id="roomtag"></div><div class="row" style="gap:6px"><button id="copy" class="ghost small">复制邀请</button><button id="leave" class="ghost small">离开</button></div></div>
    <div class="seats"><div id="seat0" class="seat"></div><div id="seat1" class="seat"></div></div>
    <div class="stage">
      <div class="eyebrow" id="round">走到对面就赢</div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div class="qb" id="board" aria-label="步步为营棋盘"></div>
      <div class="tools"><button id="tMove">🚶 走一步</button><button id="tWall">🧱 放墙</button><button id="tOri">↔ 横墙</button></div>
      <div class="confirm hidden" id="confirm"><button id="cNo" class="ghost">取消</button><button id="cYes" class="primary">墙放这里</button></div>
    </div>
    <div class="caption" id="caption"></div><button id="again" class="ghost block">重开一局</button><div class="reacts" id="reacts"></div>
  </section>
</div>
<div id="modal" class="modal hidden"><div class="card"><h3 id="mT"></h3><p id="mP"></p><div class="row" id="mBtns"></div></div></div><div id="toast" class="toast"></div>
<script src="../common.js?v=1794503478"></script>
<script src="../mqtt.min.js"></script>
<script>
(() => {
  'use strict';
  const ui=FB.ui,$=id=>document.getElementById(id),clone=s=>JSON.parse(JSON.stringify(s));
  const WALLS=10,MAXM=500,DIRS=[[-1,0],[1,0],[0,-1],[0,1]],COLORS=['#d9586b','#e9ad51'];
  let mode=null,net=null,code='',st=null,P=null,ready=false,initT=null,botT=null,celebrated='';
  let tool='move',ori=1,ghost=null; // ori 1=横 2=竖; ghost={k,r,c}
  const me=()=>mode==='bot'?'me':net.myId;
  const nameOf=id=>id==='bot'?'电脑':id===me()?'你':net.nameOf(id);
  const newer=s=>!st||s.game>st.game||(s.game===st.game&&s.v>st.v);
  const goal=side=>side===0?0:8;

  // ---------- rules ----------
  // h[r*8+c]: horizontal wall under cells (r,c),(r,c+1). v[r*8+c]: vertical wall right of cells (r,c),(r+1,c).
  function fresh(){return {p:[[8,4],[0,4]],h:new Uint8Array(64),v:new Uint8Array(64),left:[WALLS,WALLS],winner:-1,last:null};}
  function blocked(B,r,c,dr,dc){
    const H=(y,x)=>y>=0&&y<8&&x>=0&&x<8&&B.h[y*8+x],V=(y,x)=>y>=0&&y<8&&x>=0&&x<8&&B.v[y*8+x];
    if(dr===1)return H(r,c)||H(r,c-1);if(dr===-1)return H(r-1,c)||H(r-1,c-1);
    if(dc===1)return V(r,c)||V(r-1,c);return V(r,c-1)||V(r-1,c-1);
  }
  function canStep(B,r,c,dr,dc){const y=r+dr,x=c+dc;return y>=0&&y<9&&x>=0&&x<9&&!blocked(B,r,c,dr,dc);}
  function legalMoves(B,side){
    const [r,c]=B.p[side],[or,oc]=B.p[1-side],out=[];
    for(const [dr,dc] of DIRS){
      if(!canStep(B,r,c,dr,dc))continue;const y=r+dr,x=c+dc;
      if(y!==or||x!==oc){out.push([y,x]);continue;}
      if(canStep(B,y,x,dr,dc)){out.push([y+dr,x+dc]);continue;}
      for(const [er,ec] of DIRS){if(er===-dr&&ec===-dc||er===dr&&ec===dc)continue;if(canStep(B,y,x,er,ec))out.push([y+er,x+ec]);}
    }return out;
  }
  function dist(B,side,from){
    const s=from||B.p[side],g=goal(side);if(s[0]===g)return 0;
    const seen=new Uint8Array(81);seen[s[0]*9+s[1]]=1;let q=[s],d=0;
    while(q.length){d++;const n=[];for(const [r,c] of q)for(const [dr,dc] of DIRS){if(!canStep(B,r,c,dr,dc))continue;const y=r+dr,x=c+dc,i=y*9+x;if(seen[i])continue;if(y===g)return d;seen[i]=1;n.push([y,x]);}q=n;}
    return Infinity;
  }
  function wallFree(B,k,r,c){
    if(!(r>=0&&r<8&&c>=0&&c<8))return false;const i=r*8+c;
    if(B.h[i]||B.v[i])return false;
    if(k===1)return !(c>0&&B.h[i-1])&&!(c<7&&B.h[i+1]);
    return !(r>0&&B.v[i-8])&&!(r<7&&B.v[i+8]);
  }
  function wallOk(B,k,r,c){
    if(!wallFree(B,k,r,c))return false;const a=k===1?B.h:B.v;a[r*8+c]=1;
    const ok=dist(B,0)<Infinity&&dist(B,1)<Infinity;a[r*8+c]=0;return ok;
  }
  function replay(s){
    const B=fresh();
    for(let i=0;i<s.moves.length;i++){
      const m=s.moves[i];if(B.winner>=0||!Array.isArray(m)||m.length!==3||!m.every(Number.isInteger))return null;
      const side=(s.game+i)%2;
      if(m[0]===0){if(!legalMoves(B,side).some(t=>t[0]===m[1]&&t[1]===m[2]))return null;B.p[side]=[m[1],m[2]];if(m[1]===goal(side))B.winner=side;}
      else if(m[0]===1||m[0]===2){if(B.left[side]<=0||!wallOk(B,m[0],m[1],m[2]))return null;(m[0]===1?B.h:B.v)[m[1]*8+m[2]]=1;B.left[side]--;}
      else return null;
      B.last=m;
    }
    B.turn=(s.game+s.moves.length)%2;B.done=B.winner>=0;return B;
  }
  function valid(s){
    if(!s||!Number.isSafeInteger(s.game)||s.game<0||s.game>1e9||!Number.isSafeInteger(s.v)||!Array.isArray(s.moves)||s.moves.length>MAXM||s.v!==s.moves.length||!Array.isArray(s.players)||s.players.length!==2||s.players[0]===s.players[1]||!s.players.every(x=>typeof x==='string'&&/^[a-z0-9]{1,16}$/.test(x)))return false;
    return !!replay(s);
  }
  const same=(a,b)=>a&&b&&a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2];
  function compatible(s){return !st||s.game>st.game||(s.players.join('|')===st.players.join('|')&&st.moves.every((x,i)=>same(s.moves[i],x)));}
  function seatsHere(){return mode==='bot'||(ready&&net.connected()&&st&&st.players.every(id=>id===net.myId||net.alive().includes(id)));}
  function accept(s,send){
    if(!valid(s)||!newer(s)||!compatible(s))return;
    const old=st;st={game:s.game,v:s.v,players:s.players.slice(),moves:s.moves.map(m=>m.slice())};P=replay(st);
    if(!old||old.game!==st.game){ui.close();tool='move';}
    ghost=null;render();if(send&&mode==='online')net.setState(st);afterChange();
  }
  function play(m,by){
    if(!st||P.done||st.players[P.turn]!==by||!seatsHere())return false;
    const s=clone(st);s.moves.push(m);s.v++;if(!replay(s))return false;accept(s,true);return true;
  }
  function restart(){
    if(mode==='online'){
      if(!ready||!net.connected())return;
      if(st){if(!st.players.includes(me())||!seatsHere()){ui.toast('等两位玩家都在线再开');return;}if(me()!==st.players[0]){net.emit('restart',{game:st.game});return;}}
      else if(net.order().length!==2||net.order()[0]!==me())return;
    }
    accept({game:st?st.game+1:0,v:0,players:st?st.players.slice():mode==='bot'?['me','bot']:net.order(),moves:[]},true);
  }

  // ---------- computer ----------
  function botMove(){
    const B=P,side=B.turn,opp=1-side,moves=legalMoves(B,side);
    for(const t of moves)if(t[0]===goal(side))return [0,t[0],t[1]];
    const my=dist(B,side),op=dist(B,opp);
    if(B.left[side]>0&&(op<my||op<=3||(op===my&&Math.random()<.4))){
      let best=null,bestGain=0;
      for(let k=1;k<=2;k++)for(let r=0;r<8;r++)for(let c=0;c<8;c++){
        if(!wallFree(B,k,r,c))continue;const a=k===1?B.h:B.v;a[r*8+c]=1;
        const o2=dist(B,opp),m2=dist(B,side);a[r*8+c]=0;
        if(o2===Infinity||m2===Infinity)continue;
        const gain=(o2-op)-(m2-my)+Math.random()*.3;
        if(o2>op&&gain>bestGain){bestGain=gain;best=[k,r,c];}
      }
      if(best&&(bestGain>=2||(bestGain>=1&&op<=my)))return best;
    }
    let best=null,bd=Infinity;
    for(const t of moves){const d=dist(B,side,t)+Math.random()*.5;if(d<bd){bd=d;best=t;}}
    return [0,best[0],best[1]];
  }
  function afterChange(){
    if(!st)return;
    if(P.done){const k=st.game+':'+st.v;if(celebrated!==k){celebrated=k;if(st.players[P.winner]===me()||mode==='online')ui.burst('🎉');}return;}
    if(mode==='bot'&&st.players[P.turn]==='bot'&&!botT)botT=setTimeout(()=>{botT=null;if(st&&!P.done&&st.players[P.turn]==='bot')play(botMove(),'bot');},650);
  }

  // ---------- view ----------
  function mySide(){return st?st.players.indexOf(me()):-1;}
  function flip(){return mySide()===1;}
  const toReal=(vr,vc)=>flip()?[8-vr,8-vc]:[vr,vc];
  const wallView=(r,c)=>flip()?[7-r,7-c]:[r,c];
  function canAct(){return st&&!P.done&&seatsHere()&&st.players[P.turn]===me();}
  function wallEl(k,r,c,cls){
    const [a,b]=wallView(r,c),e=document.createElement('i');e.className='wall '+(cls||'');
    if(k===1){e.style.top='calc(var(--p)*'+(a+1)+' - 5px)';e.style.left='calc(var(--p)*'+b+' + 1px)';e.style.width='calc(var(--p)*2 - 7px)';e.style.height='6px';}
    else{e.style.left='calc(var(--p)*'+(b+1)+' - 5px)';e.style.top='calc(var(--p)*'+a+' + 1px)';e.style.height='calc(var(--p)*2 - 7px)';e.style.width='6px';}
    return e;
  }
  function render(){
    ui.roomTag(mode==='online'?net:null,code,'和电脑玩');$('copy').classList.toggle('hidden',mode!=='online');$('reacts').classList.toggle('hidden',mode!=='online');
    const can=canAct(),side=mySide(),player=side>=0;
    $('status').className='status'+(can?' go':'');
    if(!st)$('status').textContent=net&&!net.connected()?'连接中…':'等 TA 进入同一个房间…';
    else if(P.done)$('status').textContent=nameOf(st.players[P.winner])+'先走到对面，赢啦！🎉';
    else if(!player)$('status').textContent='本局已有两位玩家，你正在观战';
    else if(!seatsHere())$('status').textContent=mode==='online'&&!net.connected()?'连接断开，正在重连…':!ready?'正在同步房间…':'等 TA 回来，棋盘会留在这里';
    else $('status').textContent=can?(tool==='move'?'轮到你：点亮着的格子走一步':'轮到你：点格子放墙，再确认'):nameOf(st.players[P.turn])+'正在想…';
    $('round').textContent=st?'第 '+(st.game+1)+' 局 · 第 '+(st.moves.length+1)+' 手':'走到对面就赢';
    for(let p=0;p<2;p++){
      const e=$('seat'+p);e.replaceChildren();const dot=document.createElement('i');dot.className='stone c'+p;
      const w=document.createElement('span');w.className='wl';w.textContent=st?'🧱 剩 '+P.left[p]+' 堵墙'+(st.game%2===p?' · 先手':''):'';
      e.append(dot,document.createTextNode(st?nameOf(st.players[p]):(p?'金色':'莓红')),w);
      e.classList.toggle('active',!!st&&!P.done&&P.turn===p);
    }
    const board=$('board');board.replaceChildren();if(!st)return;
    const targets=can&&tool==='move'?legalMoves(P,side):[];
    for(let vr=0;vr<9;vr++)for(let vc=0;vc<9;vc++){
      const [r,c]=toReal(vr,vc),cell=document.createElement('div');cell.className='cell';
      cell.style.left='calc(var(--p)*'+vc+' + 2px)';cell.style.top='calc(var(--p)*'+vr+' + 2px)';cell.dataset.vr=vr;cell.dataset.vc=vc;
      const ms=player?side:0;if(r===goal(ms))cell.classList.add('goalme');else if(r===goal(1-ms))cell.classList.add('goalop');
      if(targets.some(t=>t[0]===r&&t[1]===c))cell.classList.add('can');
      for(let p=0;p<2;p++)if(P.p[p][0]===r&&P.p[p][1]===c){const d=document.createElement('i');d.className='pawn'+(p===side?' mine':'');d.style.background=COLORS[p];cell.appendChild(d);}
      board.appendChild(cell);
    }
    for(let k=1;k<=2;k++){const a=k===1?P.h:P.v;for(let i=0;i<64;i++)if(a[i])board.appendChild(wallEl(k,i>>3,i&7,same(P.last,[k,i>>3,i&7])?'last':''));}
    if(ghost&&can&&tool==='wall')board.appendChild(wallEl(ghost.k,ghost.r,ghost.c,'ghost'+(wallOk(P,ghost.k,ghost.r,ghost.c)?'':' bad')));
    const left=player?P.left[side]:0;
    $('tMove').classList.toggle('on',tool==='move');$('tWall').classList.toggle('on',tool==='wall');
    $('tWall').textContent='🧱 放墙（'+left+'）';$('tOri').textContent=ori===1?'↔ 横墙':'↕ 竖墙';
    $('tMove').disabled=$('tWall').disabled=!can;$('tWall').disabled=!can||left<=0;$('tOri').disabled=!can||tool!=='wall';
    $('confirm').classList.toggle('hidden',!(ghost&&can&&tool==='wall'));
    $('cYes').disabled=!(ghost&&wallOk(P,ghost.k,ghost.r,ghost.c));
    $('again').textContent=P.done?'再来一局 · 交换先后手':'重开一局';$('again').disabled=mode==='online'&&(!seatsHere()||!player);
    $('caption').textContent=P.done?'再来一局，先后手会互换。':'你在下方，走到最上面那一排（粉色）就赢。墙一堵占两格，不能把路完全封死。';
  }

  // ---------- input ----------
  $('board').onclick=e=>{
    const cell=e.target.closest('.cell');if(!cell||!canAct())return;
    const vr=+cell.dataset.vr,vc=+cell.dataset.vc;
    if(tool==='move'){const [r,c]=toReal(vr,vc);if(!play([0,r,c],me()))ui.toast('走不到那里，点亮着的格子');return;}
    // wall: anchored at the clicked cell's bottom-right corner (on screen)
    const av=Math.min(vr,7),bv=Math.min(vc,7),[r,c]=flip()?[7-av,7-bv]:[av,bv];
    const g={k:ori,r,c};
    if(ghost&&same([ghost.k,ghost.r,ghost.c],[g.k,g.r,g.c])){placeGhost();return;}
    ghost=g;render();if(!wallOk(P,g.k,g.r,g.c))ui.toast(wallFree(P,g.k,g.r,g.c)?'不能把路完全封死哦':'这里放不下，和别的墙重叠了');
  };
  function placeGhost(){if(!ghost)return;if(!wallOk(P,ghost.k,ghost.r,ghost.c)){ui.toast('这里放不了');return;}const g=ghost;ghost=null;if(play([g.k,g.r,g.c],me()))tool='move';render();}
  $('tMove').onclick=()=>{tool='move';ghost=null;render();};
  $('tWall').onclick=()=>{tool='wall';ghost=null;render();};
  $('tOri').onclick=()=>{ori=ori===1?2:1;if(ghost){ghost.k=ori;}render();};
  $('cYes').onclick=placeGhost;$('cNo').onclick=()=>{ghost=null;render();};
  $('again').onclick=()=>{if(st&&!P.done&&st.moves.length)ui.modal('重开一局？','当前棋盘会清空，并交换先后手。',[{label:'取消'},{label:'重开',primary:true,fn:restart}]);else restart();};
  $('copy').onclick=()=>ui.copyInvite(code,'步步为营');$('leave').onclick=()=>{if(net)net.close();location.href='../'+(mode==='online'?'#'+code:'');};
  ui.reacts(()=>net,9);
  function scheduleInit(){clearTimeout(initT);initT=setTimeout(()=>{ready=true;if(!st)restart();render();},1200);}
  function show(){$('lobby').classList.add('hidden');$('game').classList.remove('hidden');}
  ui.lobby({onJoin(c){mode='online';code=c;show();net=FB.net('quoridor',c,{
    onConn(ok){if(ok)scheduleInit();else ready=false;render();},
    onPeers(joined){if(joined.length)scheduleInit();render();},
    onState(s){accept(s,false);},
    onEvent(d){if(!st||!st.players.includes(d.from))return;if(d.t==='react'&&ui.EMO.slice(0,9).includes(d.e))ui.float(d.e);if(d.t==='restart'&&d.game===st.game&&me()===st.players[0])restart();}
  });render();},onLocal(){mode='bot';show();restart();}});
})();
</script>
</body>
</html>
