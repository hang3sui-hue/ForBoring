<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>数字炸弹 · ForBoring</title>
<link rel="stylesheet" href="../common.css?v=1794503478">
<style>
  .stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 16px 16px;text-align:center;overflow:hidden}
  .bomb{font-size:64px;line-height:1;display:inline-block;transition:transform .4s;filter:drop-shadow(0 6px 10px rgba(0,0,0,.15))}
  .bomb.shake{animation:shake var(--spd,1s) ease-in-out infinite}
  @keyframes shake{0%,100%{rotate:0deg}25%{rotate:calc(var(--amp,2deg) * -1)}75%{rotate:var(--amp,2deg)}}
  .range{font-family:"Songti SC","STSong",serif;font-size:42px;font-weight:700;margin:8px 0 2px;letter-spacing:2px}
  .range small{font-size:22px;color:var(--muted);margin:0 8px}
  .left{font-size:13px;color:var(--muted)}
  .bar{position:relative;height:10px;border-radius:6px;background:#efe5d8;margin:14px 2px 4px;overflow:hidden}
  .bar i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#f0a35e,var(--accent));border-radius:6px;transition:left .4s,width .4s}
  .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
  .typing{min-height:20px;font-size:13px;color:var(--muted);margin-top:8px}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .pad button{font-size:24px;padding:14px 0;background:var(--card);border:1.5px solid var(--line)}
  .pad .ok{background:var(--accent);color:#fff;border-color:var(--accent);font-size:18px}
  .screen{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;height:58px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-size:32px;font-weight:700;letter-spacing:4px}
  .screen.dim{color:#cbbfb3;font-weight:400;font-size:16px;letter-spacing:0}
  .hist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
  .hist span{font-size:12px;padding:4px 9px;border-radius:10px;background:#efe5d8;color:var(--muted)}
  .hist span b{color:var(--ink)}
  .sizes{display:flex;gap:8px;justify-content:center;margin-top:10px}
  .sizes button{padding:6px 12px;font-size:13px;border-radius:20px;background:transparent;border:1.5px solid var(--line)}
  .sizes button.on{border-color:var(--accent);color:var(--accent)}
  .flash{position:fixed;inset:0;background:radial-gradient(circle,#fff6c9 0%,#ffb347 35%,#e0455a 70%);z-index:90;pointer-events:none;animation:flash 1s ease-out forwards}
  @keyframes flash{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
  .boomtxt{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:120px;z-index:91;pointer-events:none;animation:boomt 1.1s ease-out forwards}
  @keyframes boomt{0%{transform:translate(-50%,-50%) scale(.2)}40%{transform:translate(-50%,-50%) scale(1.4)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
  .punish{margin-top:6px;padding:12px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:15px;line-height:1.6}
  .reacts button{font-size:20px;padding:6px 1px}
</style>
</head>
<body>
<div class="wrap">
  <section id="lobby">
    <a class="back" href="../">‹ 返回主页</a>
    <h1>数字炸弹</h1>
    <p class="sub">系统偷偷埋一个数字，你们轮流猜，范围越来越小……猜中的人就炸了 💣</p>
    <div class="card">
      <label for="code">房间号（字母或数字）</label>
      <div class="row">
        <input id="code" maxlength="12" placeholder="比如 love520" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="rand" class="ghost">🎲</button>
      </div>
      <button id="join" class="primary block">进入房间</button>
      <div class="divider">或者</div>
      <button id="local" class="ghost block" style="margin-top:6px">先和电脑玩</button>
    </div>
  </section>

  <section id="game" class="hidden">
    <div class="topbar">
      <div class="roomtag" id="roomtag"></div>
      <div class="row" style="gap:6px">
        <button id="copy" class="ghost small">复制邀请</button>
        <button id="leave" class="ghost small">离开</button>
      </div>
    </div>

    <div class="stage">
      <div class="bomb" id="bomb">💣</div>
      <div class="range" id="range">1<small>~</small>100</div>
      <div class="left" id="left"></div>
      <div class="bar"><i id="barI"></i></div>
      <div class="ends"><span>1</span><span id="maxLbl">100</span></div>
      <div class="sizes" id="sizes"><button data-m="50">1–50</button><button data-m="100">1–100</button><button data-m="500">1–500</button></div>
    </div>

    <div class="status" id="status"></div>
    <div class="screen dim" id="screen">输入一个数字</div>
    <div class="typing" id="typing"></div>
    <div class="pad" id="pad">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button data-k="del">⌫</button><button>0</button><button data-k="ok" class="ok">确定</button>
    </div>
    <div class="hist" id="hist"></div>
    <div class="row" style="margin-top:12px"><button id="again" class="ghost" style="flex:1">重开一局</button></div>
    <div class="reacts" id="reacts"></div>
  </section>
</div>

<div id="modal" class="modal hidden"><div class="card"><h3 id="mT"></h3><p id="mP"></p><div class="row" id="mBtns"></div></div></div>
<div id="toast" class="toast"></div>

<script src="../common.js?v=1794620000"></script>
<script src="../mqtt.min.js"></script>
<script>
(() => {
  const ui=FB.ui, $=id=>document.getElementById(id);
  const PUNISH=[
    '给对方唱一首歌（发语音）','发一张自己的丑照','夸对方三句，不能重样','讲一个冷笑话，对方不笑就再讲一个',
    '给对方点一杯奶茶','用最嗲的声音说「我错了」','模仿一种动物叫三声（语音）','说一件今天的小秘密',
    '下次见面请吃饭','给对方写一句土味情话','做 10 个深蹲（视频为证）','让对方决定你下一张头像',
    '对方可以问你一个问题，必须说真话','发一段 10 秒的即兴跳舞视频','连说三遍「你是世界上最好看的人」'
  ];
  let mode=null, net=null, code='', st=null, input='', myKey='', boomShown='';
  const ME = () => mode==='bot' ? 'me' : net.myId;

  // ---- state helpers ----
  const enc=(n,g)=>((n+137)*7+g).toString(36), dec=(k,g)=>{ const v=(parseInt(k,36)-g)/7-137; return Number.isInteger(v)?v:NaN; };
  function fresh(game, max, players){
    const bomb=1+Math.floor(Math.random()*max);
    return { game, v:0, max, lo:1, hi:max, k:enc(bomb,game), players, hist:[], loser:null, pun:-1 };
  }
  function valid(s){
    return s && Number.isInteger(s.game) && Number.isInteger(s.v) && [50,100,500].includes(s.max) && Number.isInteger(s.lo) && Number.isInteger(s.hi)
      && s.lo>=1 && s.hi<=s.max && s.lo<=s.hi && typeof s.k==='string' && Array.isArray(s.players) && s.players.length===2 && Array.isArray(s.hist) && s.hist.length<=600;
  }
  const newer=s=>!st || s.game>st.game || (s.game===st.game && s.v>st.v);
  const turnId=()=> st ? st.players[(st.game + st.hist.length) % 2] : null;
  const nameOf=id=> id==='bot' ? '电脑' : (id===ME() ? '你' : (net?net.nameOf(id):'TA'));
  const otherName=()=> mode==='bot' ? '电脑' : net.nameOf(net.opp());
  function commit(s){ st=s; render(); if(mode==='online') net.setState(s); afterChange(); }

  // ---- actions ----
  function guess(n){
    if(!st || st.loser || turnId()!==ME()) return;
    if(!(n>=st.lo && n<=st.hi)){ ui.toast('要在 '+st.lo+' ~ '+st.hi+' 之间哦'); return; }
    const bomb=dec(st.k,st.game);
    const s=JSON.parse(JSON.stringify(st)); s.v++;
    s.hist.push({ by:ME(), g:n });
    if(n===bomb){ s.loser=ME(); s.pun=Math.floor(Math.random()*PUNISH.length); }
    else if(n<bomb) s.lo=n+1; else s.hi=n-1;
    input=''; if(mode==='online') net.emit('typing',{v:''});
    commit(s);
  }
  function restart(max){
    const players = mode==='bot' ? ['me','bot'] : net.order();
    if(players.length<2){ ui.toast('等 TA 进来再开'); return; }
    commit(fresh((st?st.game:-1)+1, max || (st?st.max:100), players));
  }
  function setSize(m){
    if(!st || st.hist.length || st.loser) return;
    const s=fresh(st.game, m, st.players); s.v=st.v+1; commit(s);
  }

  // ---- bot ----
  let botT=null;
  function afterChange(){
    if(mode==='bot' && st && !st.loser && turnId()==='bot' && !botT){
      botT=setTimeout(()=>{
        botT=null; if(!st||st.loser||turnId()!=='bot') return;
        const span=st.hi-st.lo; let n = st.lo + Math.floor(span*(0.25+Math.random()*0.5)+Math.random());
        n=Math.max(st.lo, Math.min(st.hi, n));
        const bomb=dec(st.k,st.game), s=JSON.parse(JSON.stringify(st)); s.v++; s.hist.push({by:'bot',g:n});
        if(n===bomb){ s.loser='bot'; s.pun=Math.floor(Math.random()*PUNISH.length); } else if(n<bomb) s.lo=n+1; else s.hi=n-1;
        commit(s);
      }, 900+Math.random()*900);
    }
    if(st && st.loser){
      const key=st.game+':'+st.v; if(boomShown===key) return; boomShown=key;
      const fl=document.createElement('div'); fl.className='flash'; document.body.appendChild(fl); setTimeout(()=>fl.remove(),1100);
      const bt=document.createElement('div'); bt.className='boomtxt'; bt.textContent='💥'; document.body.appendChild(bt); setTimeout(()=>bt.remove(),1200);
      try{ navigator.vibrate && navigator.vibrate([80,40,160]); }catch(_){}
      const bomb=dec(st.k,st.game), meLost=st.loser===ME();
      setTimeout(()=>{
        const title = meLost ? '你被炸了！💥' : nameOf(st.loser)+' 被炸了！💥';
        ui.modal(title, '炸弹是 '+bomb, [{label:'看看'},{label:'再来一局',primary:true,fn:()=>restart()}]);
        if(!meLost) ui.burst('😂');
      }, 900);
    }
  }

  // ---- render ----
  function render(){
    ui.roomTag(mode==='online'?net:null, code, '和电脑玩');
    $('copy').classList.toggle('hidden', mode!=='online'); $('reacts').classList.toggle('hidden', mode!=='online');
    const stEl=$('status');
    if(!st){
      $('range').innerHTML='?<small>~</small>?'; $('left').textContent=''; stEl.className='status';
      stEl.textContent = mode==='online' && !net.connected() ? '连接中…' : '等待 TA 输入房间号 '+code+' 进来…';
      setPad(false); return;
    }
    $('range').innerHTML=st.lo+'<small>~</small>'+st.hi; $('maxLbl').textContent=st.max;
    const left=st.hi-st.lo+1;
    $('left').textContent = st.loser ? '炸弹是 '+dec(st.k,st.game) : '还剩 '+left+' 个数字';
    if(xray && !st.loser){ const x=document.createElement('span'); x.style.cssText='opacity:.35;margin-left:6px;font-size:11px'; x.textContent='·'+dec(st.k,st.game); $('left').appendChild(x); }
    const bi=$('barI'); bi.style.left=((st.lo-1)/st.max*100)+'%'; bi.style.width=(left/st.max*100)+'%';
    const danger=1-(left-1)/(st.max-1);
    const b=$('bomb'); b.classList.toggle('shake', !st.loser); b.textContent=st.loser?'💥':'💣';
    b.style.transform='scale('+(1+danger*0.6)+')'; b.style.setProperty('--amp',(2+danger*14)+'deg'); b.style.setProperty('--spd',(1.1-danger*0.95)+'s');
    document.querySelectorAll('#sizes button').forEach(x=>{ x.classList.toggle('on', +x.dataset.m===st.max); x.disabled = st.hist.length>0 || !!st.loser; });
    $('sizes').classList.toggle('hidden', st.hist.length>0 || !!st.loser);
    const mine=turnId()===ME();
    stEl.className='status';
    if(st.loser) stEl.textContent = (st.loser===ME()?'你':nameOf(st.loser))+' 被炸了 💥';
    else if(mode==='online' && !net.connected()) stEl.textContent='连接中…';
    else if(mine){ stEl.textContent = left===1 ? '只剩一个数字了……你只能猜它了 😱' : '轮到你猜！'; stEl.className='status go'; }
    else stEl.textContent='等 '+nameOf(turnId())+' 猜…';
    setPad(mine && !st.loser);
    const sc=$('screen'); if(input){ sc.textContent=input; sc.classList.remove('dim'); } else { sc.textContent= mine&&!st.loser ? st.lo+' ~ '+st.hi+' 之间' : '…'; sc.classList.add('dim'); }
    $('hist').innerHTML = st.hist.slice(-12).map(h=>{ const bomb=dec(st.k,st.game); const arrow = h.g===bomb?'💥':(h.g<bomb?'↑':'↓'); return '<span>'+esc(nameOf(h.by))+' <b>'+h.g+'</b> '+arrow+'</span>'; }).join('');
    $('again').textContent = st.loser ? '再来一局' : '重开一局';
  }
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function setPad(on){ document.querySelectorAll('#pad button').forEach(b=>b.disabled=!on); }

  // ---- input ----
  $('pad').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b||b.disabled) return;
    const k=b.dataset.k;
    if(k==='ok'){ if(input) guess(parseInt(input,10)); return; }
    if(k==='del') input=input.slice(0,-1);
    else if(input.length<3) input=(input+b.textContent).replace(/^0+/,'');
    if(mode==='online') net.emit('typing',{v:input});
    render();
  });
  $('sizes').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setSize(+b.dataset.m); });
  $('again').onclick=()=>{ if(!st||st.loser||!st.hist.length) restart(); else ui.modal('重开一局？','这局作废，重新埋炸弹',[{label:'取消'},{label:'重开',primary:true,fn:()=>restart()}]); };
  $('copy').onclick=()=>ui.copyInvite(code,'数字炸弹');
  $('leave').onclick=()=>{ const back='../'+(mode==='online'?'#'+code:''); if(net) net.close(); location.href=back; };
  let xray=false, seq=[];
  ui.reacts(()=>net, 9, i=>{ seq.push(i); if(seq.length>7) seq.shift(); if(seq.join('')==='0014785'){ seq=[]; xray=!xray; render(); } });

  function show(){ $('lobby').classList.add('hidden'); $('game').classList.remove('hidden'); }
  ui.lobby({
    onJoin(c){
      mode='online'; code=c; show();
      net=FB.net('bomb', c, {
        onConn(){ render(); },
        onPeers(joined,left){
          joined.forEach(i=>ui.toast(net.nameOf(i)+' 来了 💕')); left.forEach(i=>ui.toast(net.nameOf(i)+' 离开了房间'));
          if(joined.length && st) net.setState(st);
          // first game: the first seat creates it
          if(!st && net.order().length===2 && net.order()[0]===net.myId) restart(100);
          render();
        },
        onState(s){ if(valid(s) && newer(s)){ if(st && s.game>st.game) ui.close(); st=s; input=''; render(); afterChange(); } },
        onEvent(d){
          if(d.t==='react' && ui.EMO.includes(d.e)) ui.float(d.e);
          if(d.t==='typing' && typeof d.v==='string' && /^\d{0,3}$/.test(d.v)) $('typing').textContent = d.v ? net.nameOf(d.from)+' 正在输入 '+d.v+'…' : '';
        }
      });
      render();
    },
    onLocal(){ mode='bot'; code=''; show(); restart(100); }
  });
})();
</script>
</body>
</html>
