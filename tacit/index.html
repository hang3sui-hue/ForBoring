    if(mode==='online'){
      if(!ready||!net.connected())return;
      if(st){if(!st.players.includes(me())||!seatsHere()){ui.toast('等两位玩家都在线再开');return;}if(!host()){net.emit('restart',{game:st.game,kind});return;}}
      else if(net.order().length!==2||net.order()[0]!==me())return;
    }
    accept({game:st?st.game+1:0,v:0,players:st?st.players.slice():mode==='local'?['p1','p2']:net.order(),kind,r:0,rounds:[{x:[null,null]}]},true);
  }
  // One writer merges simultaneous choices. A guest retries its saved choice
  // until that exact x is acknowledged in the retained shared state.
  function takeChoice(from,game,r,x){
    if(!st||!host()||!seatsHere()||st.game!==game||st.r!==r||revealed(st))return;
    const i=st.players.indexOf(from);if(i<0||st.rounds[r].x[i]!==null||dec(x,st,r,i)<0)return;
    const s=clone(st);s.rounds[r].x[i]=x;s.v++;accept(s,true);
  }
  function resend(){
    if(mode!=='online'||!pending||!st||!seatsHere()||pending.game!==st.game||pending.r!==st.r||!st.players.includes(me()))return;
    if(host())takeChoice(me(),pending.game,pending.r,pending.x);else net.emit('choice',pending);
  }
  function localSeat(){const first=(st.game+st.r)%2;return st.rounds[st.r].x[first]===null?first:1-first;}
  const turnKey=()=>st.game+':'+st.r;
  function choose(n){
    if(!st||revealed(st)||!seatsHere())return;
    const i=mode==='local'?localSeat():st.players.indexOf(me());if(i<0||st.rounds[st.r].x[i]!==null||pending)return;
    if(mode==='local'&&st.rounds[st.r].x.some(x=>x!==null)&&localUnveiled!==turnKey())return;
    const x=enc(n,st,st.r,i);
    if(mode==='local')takeChoice(st.players[i],st.game,st.r,x);
    else{pending={game:st.game,r:st.r,x};savePending();render();resend();}
  }
  function next(from=me(),game=st&&st.game,r=st&&st.r){
    if(!st||!revealed(st)||finished(st)||!seatsHere()||st.game!==game||st.r!==r||!st.players.includes(from))return;
    if(mode==='online'&&!host()){net.emit('next',{game:st.game,r:st.r});return;}
    const s=clone(st);s.r++;s.rounds.push({x:[null,null]});s.v++;accept(s,true);
  }
  function answerLabel(s,r,i){return s.kind==='same'?nameOf(s.players[i]):nameOf(s.players[i])+((s.game+r)%2===i?'的真实想法':'的猜测');}
  function render(){
    ui.roomTag(mode==='online'?net:null,code,'同一台手机 · 双人轮流');$('copy').classList.toggle('hidden',mode!=='online');$('reacts').classList.toggle('hidden',mode!=='online');
    document.querySelectorAll('#gameModes button').forEach(b=>{b.classList.toggle('on',b.dataset.kind===(st?st.kind:selectedKind));b.disabled=mode==='online'&&(!st||!seatsHere()||!st.players.includes(me()));});
    $('again').disabled=mode==='online'&&(!st||!seatsHere()||!st.players.includes(me()));
    for(const id of ['summary','handover','answers','matched','next'])$(id).classList.add('hidden');$('questionView').classList.remove('hidden');$('private').textContent='';$('choices').replaceChildren();$('answers').replaceChildren();$('progress').replaceChildren();
    if(!st){$('status').textContent=net&&!net.connected()?'连接中…':'等待 TA 输入房间号 '+code+' 进来…';return;}
    const done=finished(st),reveal=revealed(st),q=question(st),row=st.rounds[st.r],i=mode==='local'?localSeat():st.players.indexOf(me()),own=i>=0?row.x[i]:null,opp=i>=0?row.x[1-i]:null;
    for(let r=0;r<10;r++){const e=document.createElement('i');e.className=(r<st.r||(r===st.r&&reveal))?(matched(st,r)?'hit':'miss'):r===st.r?'now':'';$('progress').appendChild(e);}
    $('round').textContent='第 '+(st.game+1)+' 局 · '+(st.kind==='same'?'一起选':'猜 TA')+' · '+(st.r+1)+' / 10 · 默契分 '+points(st);
    $('again').textContent=done?'再来一局':'重开一局';
    $('footnote').textContent=st.kind==='same'?'相同 +1 分；不同的答案，也是了解彼此的机会。':'每题交换角色：一人选真实想法，一人猜 TA；猜中 +1 分。';
    if(done){
      $('questionView').classList.add('hidden');$('summary').classList.remove('hidden');const score=points(st);$('percent').replaceChildren(document.createTextNode(score*10),Object.assign(document.createElement('small'),{textContent:'%'}));
      $('comment').textContent=score>=9?'心有灵犀，就是你们！':score>=7?'一个眼神，就懂大半。':score>=5?'有默契，也有新发现。':score>=3?'差异里，藏着新的话题。':'惊喜好多，慢慢认识你。';$('total').textContent='10 道题，'+(st.kind==='guess'?'猜中':'选中同一个答案')+' '+score+' 道。';
      $('lastReveal').textContent='最后一题：'+q[0]+'\n'+[0,1].map(j=>answerLabel(st,st.r,j)+'：'+q[1][dec(row.x[j],st,st.r,j)]).join('\n');
      $('review').replaceChildren();for(let r=0;r<10;r++){const a=document.createElement('article'),title=document.createElement('b'),p=document.createElement('p');title.textContent=(matched(st,r)?'♥ ':'○ ')+(r+1)+'. '+question(st,r)[0];p.textContent=[0,1].map(j=>answerLabel(st,r,j)+'：'+question(st,r)[1][dec(st.rounds[r].x[j],st,r,j)]).join(' / ');a.append(title,p);$('review').appendChild(a);}$('status').textContent='聊聊哪道题的答案让你最意外吧。';return;
    }
    $('question').textContent=q[0];
    const truth=(st.game+st.r)%2;
    $('role').textContent=st.kind==='same'?(mode==='local'?nameOf(st.players[i])+'，选你自己的答案':'各自选一个最像自己的答案'):i<0?'一人回答，一人猜测':i===truth?nameOf(st.players[i])+'，请回答自己的真实想法':'这题猜 '+nameOf(st.players[truth])+' 会选什么';
    if(mode==='local'&&!reveal&&row.x.some(x=>x!==null)&&localUnveiled!==turnKey()){
      $('questionView').classList.add('hidden');$('handover').classList.remove('hidden');$('handoverTitle').textContent='换 '+nameOf(st.players[i])+' 作答';$('status').textContent='两个人选好后一起揭晓';return;
    }
    if(reveal){
      $('answers').classList.remove('hidden');$('matched').classList.remove('hidden');for(let j=0;j<2;j++){const box=document.createElement('div'),small=document.createElement('small'),b=document.createElement('b');box.className='answer';small.textContent=answerLabel(st,st.r,j);b.textContent=q[1][dec(row.x[j],st,st.r,j)];box.append(small,b);$('answers').appendChild(box);}
      $('matched').textContent=matched(st,st.r)?'同一个答案，默契 +1 💞':'答案不同，又多认识你一点';$('status').textContent='可以聊聊为什么这样选，再继续下一题。';$('next').classList.remove('hidden');$('next').disabled=!seatsHere()||(mode==='online'&&i<0);return;
    }
    const locked=own!==null||!!pending,choice=own!==null?dec(own,st,st.r,i):pending?dec(pending.x,st,st.r,i):-1;
    q[1].forEach((text,n)=>{const b=document.createElement('button'),letter=document.createElement('span');letter.textContent='ABCD'[n];b.append(letter,document.createTextNode(text));b.dataset.n=n;b.classList.toggle('sel',choice===n);b.disabled=locked||!seatsHere()||i<0;b.setAttribute('aria-pressed',String(choice===n));$('choices').appendChild(b);});
    if(i<0)$('status').textContent='本局已有两位玩家，你正在观战';
    else if(!seatsHere())$('status').textContent=mode==='online'&&!net.connected()?'连接断开，正在重连…':!ready?'正在同步房间…':'等 TA 回来，已选答案会保留';
    else if(pending)$('status').textContent='答案已收好，正在同步…';
    else if(own!==null)$('status').textContent='你已选好，等 '+nameOf(st.players[1-i])+'…';
    else $('status').textContent=opp!==null?'TA 已选好，轮到你啦':'偷偷选一个，选好就锁定';
    if(mode==='online'&&xray&&i>=0&&opp!==null)$('private').textContent='· '+q[1][dec(opp,st,st.r,1-i)];
  }
  $('choices').onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled)choose(+b.dataset.n);};$('unveil').onclick=()=>{localUnveiled=turnKey();render();};$('next').onclick=()=>next();
  function confirmRestart(kind){if(st&&!finished(st)&&(st.r>0||st.rounds[0].x.some(x=>x!==null)))ui.modal('重新开始？','这局的分数会清空，换一组题再玩。',[{label:'取消'},{label:'开新局',primary:true,fn:()=>restart(kind)}]);else restart(kind);}
  $('again').onclick=()=>confirmRestart(st?st.kind:selectedKind);
  $('lobbyModes').onclick=e=>{const b=e.target.closest('button');if(!b)return;selectedKind=b.dataset.kind;document.querySelectorAll('#lobbyModes button').forEach(x=>x.classList.toggle('on',x===b));};
  $('gameModes').onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled&&st&&b.dataset.kind!==st.kind)confirmRestart(b.dataset.kind);};
  $('copy').onclick=()=>ui.copyInvite(code,'默契大考验');$('leave').onclick=()=>{if(net)net.close();location.href='../'+(mode==='online'?'#'+code:'');};
  ui.reacts(()=>net,9,i=>{if(mode!=='online')return;seq.push(i);if(seq.length>7)seq.shift();if(seq.join('')==='0014785'){seq=[];xray=!xray;render();}});
  function scheduleInit(){clearTimeout(initT);initT=setTimeout(()=>{ready=true;if(!st)restart();resend();render();},1200);}
  function show(){$('lobby').classList.add('hidden');$('game').classList.remove('hidden');}
  ui.lobby({onJoin(c){mode='online';code=c;show();net=FB.net('tacit',c,{
    onConn(ok){if(ok)scheduleInit();else ready=false;render();},onPeers(joined){if(joined.length)scheduleInit();render();},onState(s){accept(s,false);},
    onEvent(d){if(!st||!st.players.includes(d.from))return;if(d.t==='react'&&ui.EMO.slice(0,9).includes(d.e))ui.float(d.e);if(d.t==='choice')takeChoice(d.from,d.game,d.r,d.x);if(d.t==='next'&&host())next(d.from,d.game,d.r);if(d.t==='restart'&&host()&&d.game===st.game)restart(d.kind);}
  });readPending();render();},onLocal(){mode='local';show();restart(selectedKind);}});
  setInterval(resend,1500);
})();
</script>
